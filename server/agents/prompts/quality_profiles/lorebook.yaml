preference: |
  1. **设定可被后续写作直接调用**：世界观和角色档案应清晰、可查阅；相关规则说明边界、后果、例外和日常影响，每项信息都对应正文用途。
  2. **尺度与题材匹配**：先从创意种子、项目参数和已有事实判断正文需要什么，再决定模块、篇幅与细节层级。
  3. **命名服从文化与语境**：角色名、地名和组织名符合故事发生地、时代、人物身份与用户意图，复杂度和含义由作品内部逻辑决定。
  4. **跨语言兼顾真实与辨识**：以用户指定文化的真实命名习惯为基础，兼顾中文、英语、日语、韩语中的读音与视觉辨识度。
  5. **角色信息按叙事功能分配**：核心角色充分展开，次要、群像背景或功能性角色集中记录后续创作会实际调用的信息。
  6. **设定留下可用接口**：重要设定能够影响行动、理解、氛围、程序、关系、主题或作品形式，并明确影响路径。
  7. **风格与清晰度协同**：若提供作者风格档案，在保持信息密度和可读性的同时贴近其用语与句式偏好。
  8. **专属性来自准确选择**：常见事物与陌生事物都通过准确观察、有效组合和题材功能形成作品质感。
