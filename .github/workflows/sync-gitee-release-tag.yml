name: Sync Release Tag to Gitee

on:
  workflow_call:
    inputs:
      version:
        description: '可选发布版本；为空时读取 tauri.conf.json'
        required: false
        default: ''
        type: string
    secrets:
      GITEE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sync-tag:
    name: Sync tag to Gitee
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GITEE_REPOSITORY: aideaaa/spark-arc-studio
      GITEE_USERNAME: aideaaa

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ -n "$RELEASE_VERSION" ]]; then
            VERSION="${RELEASE_VERSION#sparkarc-v}"
            VERSION="${VERSION#v}"
            TAG="sparkarc-v${VERSION}"
          else
            VERSION=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
            TAG="sparkarc-v${VERSION}"
          fi

          if [[ ! "$TAG" =~ ^sparkarc-v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "无效的发布标记：$TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub Release and fetch its tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          ACTUAL_TAG=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName')

          if [[ "$ACTUAL_TAG" != "$RELEASE_TAG" ]]; then
            echo "GitHub Release 标记不匹配：期望 $RELEASE_TAG，实际 $ACTUAL_TAG" >&2
            exit 1
          fi

          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"

      - name: Push release tag to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ -z "$GITEE_TOKEN" ]]; then
            echo "缺少 GITEE_TOKEN 仓库密钥" >&2
            exit 1
          fi

          ASKPASS="$RUNNER_TEMP/gitee-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
            git push "https://gitee.com/${GITEE_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
