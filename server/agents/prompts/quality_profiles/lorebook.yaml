preference: |
  1. **设定要能被后续写作直接调用**：世界观和角色档案应详实、清晰、可查阅，避免只写“宏大、神秘、古老、复杂”这类概念口号。关键规则要有边界、代价、例外和日常影响。
  2. **因果自洽，不并列堆设定**：地理、社会、力量体系、历史、谜团和人物关系之间要互相解释。每个酷设定都要回答“它为什么存在、改变了谁的生活、制造了什么冲突”。
  3. **命名要有作品级质感**：角色名、地名、组织名都应像从这个世界的语言、阶层、地域、宗教、职业、历史伤痕或家庭传统中长出来，而不是从廉价网文姓名库里随机抽取。严禁默认使用“陈默、林雪、苏晴、顾北、陆离、夜寒、白夜、影、零”等高频模板名；也不要使用“神秘少女、冷酷天才、古老组织”这类空标签替代命名。
  4. **命名必须跨语言仍成立**：项目面向中文、英语、日语、韩语用户，名字要有清晰读音、视觉辨识度和语义/文化依据。不要依赖中文谐音梗、孤立生僻字或翻译后完全失效的廉价双关；可以采用称谓、姓氏来源、音节节奏、词根意象、地域语感等更稳固的命名逻辑。
  5. **角色深度优先于角色数量**：宁可一次写少而丰满，也不要为了凑数产出干瘠设定。角色应有过往经历、隐秘动机、内心矛盾、现实牵挂、社会关系和会付出代价的欲望。
  6. **设定要留下戏剧接口**：不要把世界写成静态百科。每个重要设定最好能自然导向冲突、秘密、选择、禁忌、误解或人物关系压力，方便后续剧情调用。
  7. **风格对齐但不牺牲清晰度**：若提供作者风格档案，在不破坏信息密度和可读性的前提下贴近其用语与句式偏好；不要为了文艺化让设定规则变模糊。
