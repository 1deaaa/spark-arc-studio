# ============================================================
# SparkArc Docker Compose 配置
# ============================================================
# 使用方法：
#   1. 复制 server/.env.example 为 server/.env 并填写 LLM_KEY
#   2. 运行: docker-compose up -d
#   3. 访问: http://localhost:6688
# ============================================================

services:
  sparkarc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparkarc
    ports:
      - "6688:6688"
    environment:
      - LLM_KEY=${LLM_KEY:-}
    volumes:
      # ====================================
      # 持久化数据挂载
      # ====================================
      # 核心数据 (users.db, notices.json)
      - ./server/data:/app/server/data
      
      # 用户创作数据
      - ./server/_userdata:/app/server/_userdata
      
      # 分享和版本快照
      - ./server/shares_data:/app/server/shares_data
      
      # LLM 配置 (llm_config.db, llm_mgr_cfg.yaml)
      # 挂载整个目录以便同时持久化数据库和配置文件
      - ./server/llm/llm_mgr:/app/server/llm/llm_mgr
      
      # 环境变量
      - ./server/.env:/app/server/.env
      
    restart: unless-stopped
