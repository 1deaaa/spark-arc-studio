name: Publish Android APK

on:
  push:
    tags:
      - 'sparkarc-v*'
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft first
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark this release as a pre-release
        required: true
        default: false
        type: boolean
      version:
        description: 'Version to release (e.g. 0.2.0). Leave empty to use current version in tauri.conf.json'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-android-apk:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version
        if: inputs.version != '' || github.ref_type == 'tag'
        working-directory: client
        env:
          RELEASE_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
        run: |
          node scripts/set-release-version.mjs

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          link-to-sdk: true

      - name: Configure Android cross compilation tools
        shell: bash
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN_BIN/llvm-ar"
          test -x "$TOOLCHAIN_BIN/llvm-ranlib"

          COMPAT_BIN="$RUNNER_TEMP/android-cross-bin"
          mkdir -p "$COMPAT_BIN"
          ln -sf "$TOOLCHAIN_BIN/llvm-ar" "$COMPAT_BIN/aarch64-linux-android-ar"
          ln -sf "$TOOLCHAIN_BIN/llvm-ranlib" "$COMPAT_BIN/aarch64-linux-android-ranlib"

          {
            echo "NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "AR=$TOOLCHAIN_BIN/llvm-ar"
            echo "RANLIB=$TOOLCHAIN_BIN/llvm-ranlib"
            echo "AR_aarch64_linux_android=$TOOLCHAIN_BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$TOOLCHAIN_BIN/llvm-ranlib"
          } >> "$GITHUB_ENV"
          echo "$COMPAT_BIN" >> "$GITHUB_PATH"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          cache-targets: true
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Check i18n keys
        working-directory: client
        run: npm run i18n:check:strict

      - name: Type check
        working-directory: client
        run: npm run typecheck

      - name: Run unit tests
        working-directory: client
        run: npm run test

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/src-tauri/gen/android/**/*.gradle*', 'client/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Initialize Android project
        working-directory: client
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri android init

      - name: Setup Python for icon processing
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/requirements-icon.txt

      - name: Install icon processing dependencies
        run: pip install -r scripts/requirements-icon.txt -q

      - name: Prepare app icon from source
        run: python scripts/prepare-icon.py

      - name: Regenerate Android icons
        working-directory: client
        run: npm run tauri icon src-tauri/icons/app-icon-source.png

      - name: Patch Android adaptive foreground safe zone
        run: python scripts/patch-android-adaptive-foreground.py

      - name: Patch Android manifest and adaptive icon
        shell: bash
        run: |
          # 1. Add roundIcon to AndroidManifest.xml
          MANIFEST="client/src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android:roundIcon' "$MANIFEST"; then
            sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"|' "$MANIFEST"
          fi

          # 2. Create ic_launcher_round.xml
          ROUND_XML="client/src-tauri/gen/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          mkdir -p "$(dirname "$ROUND_XML")"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' \
            '  <background android:drawable="@color/ic_launcher_background"/>' \
            '</adaptive-icon>' > "$ROUND_XML"

          # 3. Ensure the adaptive icon background stays white
          BG_XML="client/src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml"
          mkdir -p "$(dirname "$BG_XML")"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '  <color name="ic_launcher_background">#fff</color>' \
            '</resources>' > "$BG_XML"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing Android signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS in GitHub repository secrets."
            exit 1
          fi

          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/sparkarc-release.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/sparkarc-release.jks"
          } > client/src-tauri/gen/android/keystore.properties

          python - <<'PY'
          from pathlib import Path

          gradle_path = Path("client/src-tauri/gen/android/app/build.gradle.kts")
          text = gradle_path.read_text(encoding="utf-8")

          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\n" + text

          marker = '    defaultConfig {'
          signing_props = '''    val keystorePropertiesFile = rootProject.file("keystore.properties")
              val keystoreProperties = Properties()
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          '''
          if "val keystorePropertiesFile = rootProject.file" not in text:
              text = text.replace(marker, signing_props + marker, 1)

          build_types_marker = '    buildTypes {'
          signing_config = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["password"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["password"] as String
                  }
              }
          '''
          if 'create("release")' not in text:
              text = text.replace(build_types_marker, signing_config + build_types_marker, 1)

          release_marker = '        getByName("release") {'
          if "signingConfig = signingConfigs.getByName(\"release\")" not in text:
              text = text.replace(
                  release_marker,
                  release_marker + '\n            signingConfig = signingConfigs.getByName("release")',
                  1,
              )

          gradle_path.write_text(text, encoding="utf-8")
          PY

      - name: Build Android APK
        working-directory: client
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri -- android build --apk --target aarch64

      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '"version"' client/src-tauri/tauri.conf.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          TAG="sparkarc-v${VERSION}"

          NOTES=$(cat <<'EOF'
          SparkArc Android client builds.
          A working backend deployment is required. See the repository README for setup details.

          These artifacts are intended for self-hosting, evaluation, and integration testing.
          Default connectivity assumptions may change over time and should not be treated as a guaranteed hosted service.
          EOF
          )

          # Ensure the GitHub Release exists
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SparkArc Studio v${VERSION}" \
              --notes "$NOTES" \
              --prerelease=${{ inputs.prerelease }} \
              ${{ inputs.draft == true && '--draft' || '' }}

          # Find and upload APK artifacts
          APK_FILES=$(find client/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f 2>/dev/null || \
                     find client/src-tauri/target -name '*.apk' -type f 2>/dev/null)

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No APK files found"
            find client/src-tauri -name '*.apk' -type f
            exit 1
          fi

          echo "Found APK files:"
          echo "$APK_FILES"

          for apk in $APK_FILES; do
            # Rename to SparkArc-v{version}.apk
            ext="${apk##*.}"
            renamed="SparkArc-v${VERSION}.${ext}"
            cp "$apk" "$renamed"
            echo "Uploading $renamed (from $apk)"
            gh release upload "$TAG" "$renamed" --repo "$GITHUB_REPOSITORY" --clobber
          done
