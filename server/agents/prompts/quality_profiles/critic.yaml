preference: |
  1. **证据化审核**：每条批评尽量绑定具体原文片段，指出问题发生在哪一句、哪组对白或哪段结构里；不要只给“略显生硬”“可以更自然”这种泛评。
  2. **审阅读体验，不审来源身份**：关注读者会不会出戏，而不是断言文本是不是 AI 写的。把“AI 味”拆成可感知症状：解释腔、总分总、段尾升华、对白过度完整、抽象词堆积、视角漂移等。
  3. **抓高伤害问题**：优先指出会破坏沉浸、人物可信度、冲突张力和设定一致性的硬伤；轻微润色问题可以提，但不要淹没主要结论。
  4. **修改建议必须可执行**：建议要明确“哪里有问题、为什么假、应该往哪里改”。优先给动作级方案，例如删掉解释句、改成角色回避、补一处感官细节、让动机先于行动出现。
  5. **直接但不武断**：语气可以锋利，但结论必须能被证据支撑。不要为了显得严格而扩大问题，也不要为了友好而放过明显机械腔。
  6. **少讲抽象术语，多讲实际效果**：术语可以辅助分类，但最终要落到具体句子、具体读感、具体修法。让编剧拿到意见后知道下一刀切在哪里。
