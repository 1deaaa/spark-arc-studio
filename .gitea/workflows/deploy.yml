# ============================================================
# SparkArc Gitea Actions — 自动构建 & 部署
# ============================================================
# 触发条件: push 到 main 分支
# 运行环境: act_runner (Docker 模式，挂载宿主机 Docker Socket)
# ============================================================

name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # 镜像和容器命名
      IMAGE_TAG: "sparkarc:local"
      CONTAINER_NAME: "sparkarc"
      # 数据卷命名
      VOL_DATA: "sparkarc_data"
      VOL_USERDATA: "sparkarc_userdata"
      VOL_SHARES: "sparkarc_shares"
      VOL_LLM_CONFIG: "sparkarc_llm_config"

    steps:
      # ========================================
      # Step 1: 检出代码
      # ========================================
      - name: 📥 检出代码
        uses: actions/checkout@v4

      # ========================================
      # Step 2: 构建 Docker 镜像
      # ========================================
      # 利用 BuildKit 进行构建，DOCKER_BUILDKIT=1 启用高级缓存
      # Dockerfile 中的 --mount=type=cache 会将 npm/pip 缓存
      # 持久化在宿主机 Docker 的 overlay 层中，跨次构建复用
      # 代码变更时 COPY 指令会自动失效对应缓存层，确保更新不受影响
      # ========================================
      - name: 🔨 构建镜像
        run: |
          echo "🔨 开始构建镜像..."
          DOCKER_BUILDKIT=1 docker build -t $IMAGE_TAG .
          echo "✅ 镜像构建完成"

      # ========================================
      # Step 3: 测试（预留）
      # ========================================
      # 将来可扩展：pytest 单元测试、前端测试等
      # 示例: docker run --rm $IMAGE_TAG pytest server/test/ -v
      # ========================================
      - name: 🧪 测试
        run: echo "📋 待添加测试"

      # ========================================
      # Step 4: 部署
      # ========================================
      - name: 🚀 部署应用
        env:
          LLM_KEY: ${{ secrets.LLM_KEY }}
        run: |
          echo "🚀 开始部署..."

          # 创建所有数据卷（已存在则跳过）
          docker volume create $VOL_DATA || true
          docker volume create $VOL_USERDATA || true
          docker volume create $VOL_SHARES || true
          docker volume create $VOL_LLM_CONFIG || true

          # 写入主密钥到 llm_mgr/.env（如果配置了 Secret）
          if [ -n "${LLM_KEY}" ]; then
            echo "✅ 检测到 LLM_KEY，写入 .env 文件"
            docker run --rm \
              -v $VOL_LLM_CONFIG:/app/server/llm/llm_mgr \
              alpine:latest sh -lc "printf 'LLM_KEY=%s\n' \"${LLM_KEY}\" > /app/server/llm/llm_mgr/.env"
          else
            echo "⚠️  未配置 LLM_KEY，请在首次启动后通过前端设置主密钥"
          fi

          # 停止并删除旧容器
          docker rm -f $CONTAINER_NAME || true

          # 启动新容器
          # ⚠️ llm_mgr 整个目录挂载，代码同步由 entrypoint.sh 自动完成
          docker run -d \
            --name $CONTAINER_NAME \
            -p 7788:6688 \
            -v $VOL_DATA:/app/server/data \
            -v $VOL_USERDATA:/app/server/_userdata \
            -v $VOL_SHARES:/app/server/shares_data \
            -v $VOL_LLM_CONFIG:/app/server/llm/llm_mgr \
            --restart unless-stopped \
            $IMAGE_TAG

          # 等待容器启动并验证
          sleep 3
          docker ps | grep $CONTAINER_NAME
          echo "✅ 部署完成！访问 http://localhost:7788"

      # ========================================
      # Step 5: 清理
      # ========================================
      - name: 🧹 清理悬空镜像
        run: docker image prune -f || true
