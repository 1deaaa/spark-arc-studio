preference: |
  1. **先识别作品的表达契约**：从题材、视角、作者风格、场景功能与已有正文中建立本场的表达基准。
  2. **旁白质地服从场景**：信息密度、叙述距离、句法与分段节奏共同实现当前场景意图。
  3. **对白服从人物与语境**：语言内容、信息密度、语体、节奏与互动方式符合人物、关系、现场目标和作品风格。
  4. **语言承担具体功能**：句式、连接、抽象概括、修辞和段落收束都应带来信息、节奏、视角或情绪价值。
  5. **篇幅服务功能**：各部分的展开程度由场景任务、信息价值与节奏需要决定。
  6. **风格保持一致且有效**：文风服务人物、视角、场景目标和章节位置,同时维持人物逻辑与阅读清晰度。
