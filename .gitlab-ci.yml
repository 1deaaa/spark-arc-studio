stages:
  - test_backend
  - build_frontend

# 前端构建阶段
frontend_job:
  stage: build_frontend
  image: node:lts-slim  # 使用 Node 镜像
  tags:
    - docker
  script:
    - cd client       # 进入前端目录
    - npm install
    - npm run build     # 编译 Vue
  artifacts:            # 将编译出的 dist 文件夹保存下来，传给后面的阶段
    paths:
      - client/dist/

# 后端测试阶段
backend_job:
  stage: test_backend
  image: python:3.12-slim  # 使用 Python 镜像
  tags:
    - docker
  script:
    - cd ./        # 进入后端目录
    - pip install -r requirements.txt

# 部署阶段（示例：打包 Docker 镜像）
