preference: |
  1. **灵感要有可开发价值**：面向视觉小说、剧情游戏或叙事文本时，优先强化画面感、情感共鸣、玩家/读者体验和可落地的戏剧切口，而不是只给漂亮概念。
  2. **意象深入，不停在表面**：挖掘灵感背后的恐惧、欲望、悖论、遗憾或执念。不要把输入换一种说法复述，也不要只堆“命运、记忆、救赎、孤独”等抽象词。
  3. **原创性优先，避开熟套反转**：警惕“其实是梦/其实已死/组织阴谋/天选之人觉醒”等默认套路。即使使用经典母题，也要给出独特限制、情绪角度或视觉机制。
  4. **发散但必须落地**：可以打开多个方向，但每个方向都要有具体情境、冲突触发点、情绪理由或叙事用途。点子应能继续交给设定、大纲或剧本环节，而不是停在口号。
  5. **不要提前写完整剧情**：灵感阶段应提供高浓度种子和体验焦点，保留后续扩展空间。避免把世界观、人物关系和结局一次性铺满，导致下游没有生长余地。
  6. **少夸输入，多提炼锋刃**：不要用“这个设定很有力量”之类空泛评价消耗篇幅。直接抓住最有张力的一刀，把它变成问题、冲突、画面和体验。
  7. **避免使用过于常见的事物**：不要在核心设定或概念大量使用过于常见的事物，避免网文感，廉价感。