stages:
  - build
  - test
  - deploy

variables:
  # Docker 连接配置
  DOCKER_HOST: "tcp://host.docker.internal:2375"
  DOCKER_TLS_CERTDIR: ""
  # 镜像和容器命名
  IMAGE_TAG: "sparkarc:local"
  CONTAINER_NAME: "sparkarc"

# ============================================================
# 阶段1: 构建镜像
# ============================================================
# 包含：前端编译 + 后端依赖安装
# 如果前端编译失败或依赖安装失败，这里会直接报错
# ============================================================
build:
  stage: build
  image: docker:27.5.1
  tags:
    - docker
  script:
    - echo "🔨 开始构建镜像..."
    - docker build -t $IMAGE_TAG .
    - echo "✅ 镜像构建完成"

# ============================================================
# 阶段2: 测试
# ============================================================
# 验证运行时：模块能否正确加载（捕获 import 错误）
# 将来可扩展：pytest 单元测试
# ============================================================
test:
  stage: test
  image: docker:27.5.1
  tags:
    - docker
  script:
    - echo "待添加测试"
    # ==== 将来添加 pytest ====
    # - docker run --rm $IMAGE_TAG pytest server/test/ -v

# ============================================================
# 阶段3: 部署
# ============================================================
deploy:
  stage: deploy
  image: docker:27.5.1
  tags:
    - docker
  variables:
    # 数据卷命名
    VOL_DATA: "sparkarc_data"
    VOL_USERDATA: "sparkarc_userdata"
    VOL_SHARES: "sparkarc_shares"
    VOL_LLM_CONFIG: "sparkarc_llm_config"
  script:
    - echo "🚀 开始部署..."
    # 创建所有数据卷
    - docker volume create $VOL_DATA || true
    - docker volume create $VOL_USERDATA || true
    - docker volume create $VOL_SHARES || true
    - docker volume create $VOL_LLM_CONFIG || true
    # 停止并删除旧容器
    - docker rm -f $CONTAINER_NAME || true
    # 启动新容器
    - |
      docker run -d \
        --name $CONTAINER_NAME \
        -p 6688:6688 \
        -v $VOL_DATA:/app/server/data \
        -v $VOL_USERDATA:/app/server/_userdata \
        -v $VOL_SHARES:/app/server/shares_data \
        -v $VOL_LLM_CONFIG:/app/server/llm/llm_mgr \
        -e LLM_KEY="${LLM_KEY:-}" \
        --restart unless-stopped \
        $IMAGE_TAG
    - sleep 3
    - docker ps | grep $CONTAINER_NAME
    - echo "✅ 部署完成！http://localhost:6688"
    # 清理悬空镜像
    - docker image prune -f || true