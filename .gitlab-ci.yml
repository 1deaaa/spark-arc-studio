stages:
  - test_cicd
  - build_frontend
  - test_backend
  - deploy

variables:
  # 让 CI 容器里的 docker client 直连 Docker Desktop
  DOCKER_HOST: "tcp://host.docker.internal:2375"
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: "sparkarc:local"
  CONTAINER_NAME: "sparkarc"

test_cicd:
  stage: test_cicd
  tags:
    - docker
  script:
    - echo "hello"
    - date
    - uname -a

# 前端构建阶段
frontend_job:
  stage: build_frontend
  image: node:lts-slim  # 使用 Node 镜像
  tags:
    - docker
  cache:
    key:
      files:
        - client/package-lock.json
    paths:
      - client/node_modules/
  script:
    - cd client       # 进入前端目录
    - npm install
    - npm run build     # 编译 Vue
  artifacts:            # 将编译出的 dist 文件夹保存下来，传给后面的阶段
    paths:
      - client/dist/

# 后端测试阶段
backend_job:
  stage: test_backend
  image: python:3.12-slim  # 使用 Python 镜像
  tags:
    - docker
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  script:
    - cd ./        # 进入后端目录
    - pip install -r requirements.txt

deploy_docker_desktop:
  stage: deploy
  image: docker:27.5.1
  tags:
    - docker
  script:
    - docker info
    - docker build --pull -t $IMAGE_TAG .
    - docker rm -f $CONTAINER_NAME || true
    - docker run -d --name $CONTAINER_NAME -p 6688:6688 $IMAGE_TAG