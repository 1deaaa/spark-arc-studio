name: Publish Android APK

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft first
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark this release as a pre-release
        required: true
        default: false
        type: boolean
      version:
        description: 'Version to release (e.g. 0.2.0). Leave empty to use current version in tauri.conf.json'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-android-apk:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version
        if: inputs.version != ''
        working-directory: client
        run: |
          VERSION="${{ inputs.version }}"
          echo "Setting version to $VERSION"
          # package.json
          npm pkg set version="$VERSION"
          # tauri.conf.json
          sed -i 's/"version": *"[^"]*"/"version": "'$VERSION'"/' src-tauri/tauri.conf.json
          # Cargo.toml
          sed -i 's/^version = "[^"]*"/version = "'$VERSION'"/' src-tauri/Cargo.toml
          echo "Version set to $VERSION"
          cat src-tauri/tauri.conf.json | grep version
          cat src-tauri/Cargo.toml | head -5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          link-to-sdk: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          cache-targets: true
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Check i18n keys
        working-directory: client
        run: npm run i18n:check:strict

      - name: Type check
        working-directory: client
        run: npm run typecheck

      - name: Run unit tests
        working-directory: client
        run: npm run test

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/src-tauri/gen/android/**/*.gradle*', 'client/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Initialize Android project
        working-directory: client
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri android init

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing Android signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS in GitHub repository secrets."
            exit 1
          fi

          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/sparkarc-release.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/sparkarc-release.jks"
          } > client/src-tauri/gen/android/keystore.properties

          python - <<'PY'
          from pathlib import Path

          gradle_path = Path("client/src-tauri/gen/android/app/build.gradle.kts")
          text = gradle_path.read_text(encoding="utf-8")

          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\n" + text

          marker = '    defaultConfig {'
          signing_props = '''    val keystorePropertiesFile = rootProject.file("keystore.properties")
              val keystoreProperties = Properties()
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          '''
          if "val keystorePropertiesFile = rootProject.file" not in text:
              text = text.replace(marker, signing_props + marker, 1)

          build_types_marker = '    buildTypes {'
          signing_config = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["password"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["password"] as String
                  }
              }
          '''
          if 'create("release")' not in text:
              text = text.replace(build_types_marker, signing_config + build_types_marker, 1)

          release_marker = '        getByName("release") {'
          if "signingConfig = signingConfigs.getByName(\"release\")" not in text:
              text = text.replace(
                  release_marker,
                  release_marker + '\n            signingConfig = signingConfigs.getByName("release")',
                  1,
              )

          gradle_path.write_text(text, encoding="utf-8")
          PY

      - name: Build Android APK
        working-directory: client
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri android build

      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '"version"' client/src-tauri/tauri.conf.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          TAG="sparkarc-v${VERSION}"

          # 确保 Release 存在
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SparkArc Studio v${VERSION}" \
              --notes "SparkArc Studio v${VERSION}" \
              --prerelease=${{ inputs.prerelease }} \
              ${{ inputs.draft == true && '--draft' || '' }}

          # 查找并上传 APK
          APK_FILES=$(find client/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f 2>/dev/null || \
                     find client/src-tauri/target -name '*.apk' -type f 2>/dev/null)

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No APK files found"
            find client/src-tauri -name '*.apk' -type f
            exit 1
          fi

          echo "Found APK files:"
          echo "$APK_FILES"

          for apk in $APK_FILES; do
            # 重命名为 SparkArc-v{版本号}.apk
            ext="${apk##*.}"
            renamed="SparkArc-v${VERSION}.${ext}"
            cp "$apk" "$renamed"
            echo "Uploading $renamed (from $apk)"
            gh release upload "$TAG" "$renamed" --repo "$GITHUB_REPOSITORY" --clobber
          done
