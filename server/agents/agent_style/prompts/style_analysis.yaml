# ==================== 通用 Schema 定义 ====================
#用于注入到 prompt 中，使用单花括号 (因为注入后不再进行 format)
common_style_schema: |
    "cognitive_fingerprint": {
      "association_pathway": "联想跳跃路径（如：实体→哲理、实体→记忆、情感→物质化，他是如何从眼前事物展开思维的）",
      "abstraction_tendency": "抽象化倾向（倾向于把具体事物抽象化，还是把抽象概念具体化体，抑或反常搭配）",
      "causal_logic": "因果逻辑态度（叙述是强因果逻辑、还是弱因果/反因果，是否喜欢留下没有答案的问题）",
      "observation_angle": "观察切入角度（全景切入细节 / 细节切出全景）"
    },
    "verbal_physicality": {
      "sentence_weight_and_breath": "句子重量与呼吸（短促有力碎句还是绵长缠绕复句，标志性的断句习惯，破折号/省略号偏好）",
      "modifier_density": "修饰密度与位置（高修饰还是低修饰，形容词是精准克制还是铺张堆叠）",
      "verb_subject_preference": "动词与主语赋权倾向（习惯让谁做句子的主语/施事者：人物自身、环境物理特征、抽象情绪？偏心理还是物理动作？）",
      "metaphor_gene": "修辞构造基因（常用的修辞手法以及修辞构造方式。如造比喻、拟物、通感等高级手法的迁移路径：从什么域向什么域迁移？如空间→液体。）"
    },
    "emotional_processing": {
      "emotion_presentation": "情绪呈现策略（面临强烈情绪时是直给/转移焦点用不相干动作替代/反向表达/压缩延迟）",
      "climax_handling": "高潮处理方式（到达情感最高点时，是浓墨排比放大，还是骤然收束留白）",
      "vulnerability_expression": "脆弱的面貌（痛苦时语言是变得细碎无逻辑，还是以华丽修辞掩饰，还是异常冷静克制）"
    },
    "sensory_and_attention": {
      "sensory_priority": "感官主导与迁移（五感中何者主导，是否存在固定的感官转移如视觉转嗅觉）",
      "focus_shifting": "重大时刻焦点偏移（发生重要事件冲突时，注意力是否故意转移至不相干的微小细节）",
      "temporal_rhythm": "时间感与节奏分配（重要的瞬间被拉伸，还是巨变的一整个时期被一句话压缩带过）"
    },
    "interpersonal_field": {
      "dialogue_efficiency": "对话信息效率（角色沟通是高效的一问一答，还是各说各话的错位感，还是夹杂大量废话）",
      "silence_mechanism": "沉默与留白机制（对话中何时不说话，不说话时靠什么动作或描写填充空白）",
      "narrator_temperature": "叙述者温度即人际距离（叙述者对读者或对其他人物的默认态度：疏离/防备/亲密/暧昧/俯视俯瞰）"
    }

# ==================== 统一风格分析 (单块) ====================
unified_analysis:
  prompt: |
    你是专业的文学风格分析师。请通过以下“作家操作系统（Author OS）”的纯方法论架构分析以下文本片段（第{current}/{total}部分），提取作者的行文与思考指纹。

    {context}
    
    【待分析文本】
    {text}

    请输出JSON格式：
    {{
      "style_analysis": {{
    {json_schema}
      }},
      "context_summary": "用简要的语言概括这段的主要剧情进展（100字内），由于这只是传给下一块的上下文，不计入最终成型档案"
    }}

    注意：
    1. 分析基于文本实际表现，提取作家大脑的“造句引擎”，而不是他写出的“故事本体”。
    2. 如果某个维度在当前片段中不明显，可以标注"待后续补充"
    3. 🚨【风格提取而非情节抄袭】：在 `style_analysis` 的提取中，**绝对禁止**出现当前文本中的具体人名、地名、特有专有名词、特定剧情动作。风格档案是跨体裁、跨题材通用的脱水记录！

# ==================== 最终汇总分析 ====================
final_synthesis:
  prompt: |
    你是专业的文学风格分析师。现在你已经分析了这位作者作品的所有片段，请基于：
    1. 之前各片段的分析结果（JSON摘要）
    2. 最后一个片段的内容
    3. 累积的剧情概括

    汇总输出这位作者的**完整风格档案**。

    {context}

    【最后一段文本】
    {text}

    【之前的分析结果摘要】
    {previous_analyses}

    【累积剧情概括】
    {context_summaries}

    请输出最终的跨体裁通用风格档案JSON：
    {{
    {json_schema},
      "coordinator": {{
        "signature_style": "标志性特征（最能代表作者的10-15个独特手法、思考路径、感官偏好）",
        "style_coherence": "风格一致性评价",
        "distinctive_summary": "独特性总结（用3-5句话概括这位作者最与众不同、从所有杂作中都能一眼认出他的纯底层指纹）",
        "negative_constraints": ["标注作者绝对不会采用的表达惯性、认知雷区"]
      }}
    }}

    注意：
    1. 这是最终档案，将被用作通用写作模板。要求泛化，可用于各种文体。
    2. 🚨 【风格提取而非情节抄袭】：**绝对禁止**出现当前文本中的具体人名、地名、特有专有名词、特定剧情动作。风格档案是跨体裁、跨题材通用的脱水精华！
# ==================== 风格验证 Agent ====================
validator:
  summary_prompt: |
    请用一句话概括这段文字的大意：
    {text}

  mimic_prompt: |
    请扮演该作者，基于以下风格档案，将摘要扩写为一段文字。
    风格档案：{profile}
    摘要：{summary}
    要求：极度贴合作者文风，不要出现AI味，捕捉文字的呼吸感。

  grading_rubric: |
    【S级 (完美拟合 | Perfect Fit)】
    - 核心特征：隐形成文。不仅用词一致，连“思维跳跃的方式”和“留白”都完全复刻。
    - 句法表现：长短句交错的呼吸感与原文一致，没有显性的逻辑连接词（如“首先、然而”）除非原文常包含。
    - 违和感：0。读起来就像作者本人在无意识状态下的练笔。

    【A级 (高保真 | High Fidelity)】
    - 核心特征：形似度极高。准确捕捉了作者的常用词汇（口头禅）和语气助词。
    - 缺陷：在极个别复杂的长句中，稍微流露出了AI的条理性，逻辑过于严密，缺少人的“随意感”。
    - 判定标准：乍看之下无法分辨，需细读才能发现“逻辑连接”略显生硬。

    【B级 (AI味残留 | AI Residue)】
    - 核心特征：套皮感。虽然用了很多作者的词汇，但骨子里还是 AI 的“总分总”结构或“解释性”语气。
    - 缺陷：出现典型的 LLM 味道，例如喜欢升华主题、过度使用连接词（因此、此外）、说教感。
    - 判定标准：像是一个尽职的模仿秀演员，虽然穿了角色的衣服，但说话腔调还是自己的。

    【C级 (过拟合/刻板印象 | Overfitting)】
    - 核心特征：用力过猛。频繁堆砌作者的特色词汇，导致行文不通顺或显得滑稽。
    - 缺陷：捕捉到了风格特征（Feature），丢失了语境逻辑（Context）。比如作者偶尔用一句脏话，模仿文却每句都有。
    - 判定标准：像是一个拙劣的讽刺作品，把作者的特点放大到了不自然的程度。

    【D级 (坍塌 | Collapse)】
    - 核心特征：完全偏离。退化为标准的“智能助手”语气，或者风格完全搞错（例如把严肃文风写成了欢脱文风）。
    - 判定标准：与原文毫无关系，完全是通用的 AI 回复。

  eval_prompt: |
    你是文学风格鉴赏家与数据分析师。请基于【评级标准】对模仿文进行严格的图灵测试。

    【评级标准】
    {grading_rubric}

    【原文样本】
    {test_text}

    【模仿生成】
    {mimic_text}

    请分析并输出JSON（不要输出Markdown格式）：
    {{
        "similarity_level": "S/A/B/C/D",
        "detected_ai_features": ["列出具体的AI味特征，如：'逻辑连接词过多'、'结尾强行升华'"],
        "missing_style_features": ["列出缺失的作者特征，如：'缺少短句断奏'、'形容词不够辛辣'"],
        "refinement_suggestions": "针对上述缺失/多余特征，给出一句具体的Prompt修正指令（例如：'强制禁止使用‘然而’、‘总而言之’等连接词'）"
    }}
