# ==================== 统一风格分析 (单块) ====================
unified_analysis:
  prompt: |
    你是专业的文学风格分析师。请分析以下文本片段（第{current}/{total}部分），从七个维度提取作者的风格特征。

    {context}
    
    【待分析文本】
    {text}

    请输出JSON格式：
    {{
      "style_analysis": {{
    {json_schema}
      }},
      "context_summary": "用简要的语言概括这一段的主要剧情和重要信息（100-200字），以便接续分析后文"
    }}

    注意：
    1. 分析要具体、基于文本实际表现
    2. context_summary 简要概括剧情要点即可
    3. 如果某个维度在当前片段中不明显，可以标注"待后续补充"
    4. 输入内容可能是散文、小说、剧本、诗歌等常见文学作品体裁，也有可能混杂多种体裁。**如果文本中明显缺失某个维度的内容（如纯对话文本没有环境描写），请在该维度或子项下明确标记"未涉及"，绝对不要无中生有**。

# ==================== 最终汇总分析 ====================
final_synthesis:
  prompt: |
    你是专业的文学风格分析师。现在你已经分析了这位作者作品的所有片段，请基于：
    1. 之前各片段的分析结果（JSON摘要）
    2. 最后一个片段的内容
    3. 累积的剧情概括

    汇总输出这位作者的**完整风格档案**。

    {context}

    【最后一段文本】
    {text}

    【之前的分析结果摘要】
    {previous_analyses}

    【累积剧情概括】
    {context_summaries}

    请输出最终的风格档案JSON：
    {{
    {json_schema},
      "coordinator": {{
        "signature_style": "标志性特征（最能代表作者的10-15个独特风格要素）",
        "style_coherence": "风格一致性（各维度之间的协调度/是否形成统一风格/风格冲突点等）",
        "distinctive_summary": "独特性总结（用3-5句话概括这位作者最与众不同的地方）"
      }},
      "plot_summary": "整部作品的主要剧情概括"
    }}

    注意：
    1. 这是最终档案，要全面、具体、可操作
    2. 基于所有分析结果汇总，不要遗漏重要特征
    3. negative_constraints 很重要，要明确标注作者"绝对不用"的表达
    4. 对于在所有片段中均标记为"未涉及"或确实缺失的维度，请保留"未涉及"的标记或说明，不要强行制造分析结果。

# ==================== 风格验证 Agent ====================
validator:
  summary_prompt: |
    请用一句话概括这段文字的大意：
    {text}

  mimic_prompt: |
    请扮演该作者，基于以下风格档案，将摘要扩写为一段文字。
    风格档案：{profile}
    摘要：{summary}
    要求：极度贴合作者文风，不要出现AI味，捕捉文字的呼吸感。

  grading_rubric: |
    【S级 (完美拟合 | Perfect Fit)】
    - 核心特征：隐形成文。不仅用词一致，连“思维跳跃的方式”和“留白”都完全复刻。
    - 句法表现：长短句交错的呼吸感与原文一致，没有显性的逻辑连接词（如“首先、然而”）除非原文常包含。
    - 违和感：0。读起来就像作者本人在无意识状态下的练笔。

    【A级 (高保真 | High Fidelity)】
    - 核心特征：形似度极高。准确捕捉了作者的常用词汇（口头禅）和语气助词。
    - 缺陷：在极个别复杂的长句中，稍微流露出了AI的条理性，逻辑过于严密，缺少人的“随意感”。
    - 判定标准：乍看之下无法分辨，需细读才能发现“逻辑连接”略显生硬。

    【B级 (AI味残留 | AI Residue)】
    - 核心特征：套皮感。虽然用了很多作者的词汇，但骨子里还是 AI 的“总分总”结构或“解释性”语气。
    - 缺陷：出现典型的 LLM 味道，例如喜欢升华主题、过度使用连接词（因此、此外）、说教感。
    - 判定标准：像是一个尽职的模仿秀演员，虽然穿了角色的衣服，但说话腔调还是自己的。

    【C级 (过拟合/刻板印象 | Overfitting)】
    - 核心特征：用力过猛。频繁堆砌作者的特色词汇，导致行文不通顺或显得滑稽。
    - 缺陷：捕捉到了风格特征（Feature），丢失了语境逻辑（Context）。比如作者偶尔用一句脏话，模仿文却每句都有。
    - 判定标准：像是一个拙劣的讽刺作品，把作者的特点放大到了不自然的程度。

    【D级 (坍塌 | Collapse)】
    - 核心特征：完全偏离。退化为标准的“智能助手”语气，或者风格完全搞错（例如把严肃文风写成了欢脱文风）。
    - 判定标准：与原文毫无关系，完全是通用的 AI 回复。

  eval_prompt: |
    你是文学风格鉴赏家与数据分析师。请基于【评级标准】对模仿文进行严格的图灵测试。

    【评级标准】
    {grading_rubric}

    【原文样本】
    {test_text}

    【模仿生成】
    {mimic_text}

    请分析并输出JSON（不要输出Markdown格式）：
    {{
        "similarity_level": "S/A/B/C/D",
        "detected_ai_features": ["列出具体的AI味特征，如：'逻辑连接词过多'、'结尾强行升华'"],
        "missing_style_features": ["列出缺失的作者特征，如：'缺少短句断奏'、'形容词不够辛辣'"],
        "refinement_suggestions": "针对上述缺失/多余特征，给出一句具体的Prompt修正指令（例如：'强制禁止使用‘然而’、‘总而言之’等连接词'）"
    }}
