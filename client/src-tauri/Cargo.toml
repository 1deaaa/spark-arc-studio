[package]
name = "sparkarc"
version = "0.1.0"
description = "SparkArc Studio"
authors = ["SparkArc"]
edition = "2021"

[lib]
name = "sparkarc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
