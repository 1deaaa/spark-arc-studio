<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    
    <title>StoryTeller</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="header-left">
                <div class="logo" title="返回首页">StoryTeller</div>
                <div class="project-selector fancy">
                    <label for="project-dropdown" class="selector-label">项目</label>
                    <div class="project-select-wrapper">
                        <select id="project-dropdown" class="styled-select"></select>
                        <div class="project-actions">
                            <button id="new-project-btn" class="btn-icon" title="新建项目">➕</button>
                            <button id="delete-project-btn" class="btn-icon danger" title="删除当前项目">🗑️</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-center header-buttons">
                <button id="new-scene-btn" class="btn-primary" title="创建一个新的场景">🧩 场景</button>
                <button id="import-btn" class="btn-secondary" title="从本地导入 .story 文件">📥 导入</button>
                <input type="file" id="import-file-input" accept=".story" style="display:none;">
                <button id="export-btn" class="btn-secondary" title="导出当前脚本">📤 导出</button>
                <button id="save-btn" class="btn-primary" title="保存 (Ctrl+S)">💾 保存</button>
                <button id="settings-btn" class="btn-secondary" title="编辑世界观 / 角色设定">🛠️ 设定</button>
            </div>
            <div class="header-right">
                <button id="auto-save-btn" class="auto-save-off toggle-btn-pill" title="切换自动保存">🚫自动保存-OFF</button>
                <div class="user-info">
                    <span id="username-display">加载中...</span>
                    <button id="logout-btn" class="logout-btn" title="登出当前账号">↩︎ 登出</button>
                </div>
            </div>
        </header>
        

        <main>
            <div class="panel file-panel">
                <h2>文件管理器</h2>
                <div class="file-controls toolbar-strip">
                    <button id="new-folder-btn" class="btn-icon" title="新建文件夹 (F7)">📁</button>
                    <button id="new-file-btn" class="btn-icon" title="新建故事文件 (F8)">📄</button>
                    <button id="refresh-files-btn" class="btn-icon" title="刷新文件列表">🔄</button>
                    <button id="delete-file-btn" class="btn-icon danger" title="删除所选">🗑️</button>
                </div>
                <div id="file-tree" class="file-tree"></div>
            </div>

            <div class="resizer" data-resize="file"></div>

            <div class="panel left-panel">
                <h2>场景列表</h2>
                <div id="scene-list" class="scene-list"></div>
            </div>

            <div class="resizer" data-resize="left"></div>

            <div class="panel middle-panel">
                <h2>对话树</h2>
                <div id="dialogue-tree" class="dialogue-tree"></div>
                <!-- 设定编辑内容容器 -->
                <div id="settings-editor-container" style="display: none;"></div>
            </div>            <div class="resizer" data-resize="left"></div>
            <div class="resizer" data-resize="middle"></div><div class="panel right-panel">
                <div id="editor-toolbar" class="right-panel-section">
                    <div class="toolbar-header">
                        <div class="toolbar-title">工具栏</div>
                        <div class="toolbar-buttons">
                            <button id="undo-btn">撤销</button>
                        <button id="redo-btn">重做</button>
                            <button id="overview-btn">总览</button>
                        </div>
                    </div>
                </div>
                <div id="ai-screenwriter" class="right-panel-section">
                    <div class="toolbar-title">AI 编剧</div>
                    <div class="form-group">
                        <label for="ai-mode-select">模式:</label>
                        <select id="ai-mode-select">
                            <option value="single-node">单节点续写</option>
                            <option value="multi-node">多段续写</option>
                        </select>
                    </div>

                    <!-- 单节点续写模式的控件 -->
                    <div id="single-node-controls" class="ai-mode-controls">
                        <div class="form-group">
                            <label for="ai-single-length">续写长度:</label>
                            <input type="number" id="ai-single-length" value="100" min="10" max="1000">
                        </div>
                        <button id="ai-generate-single-btn" class="ai-btn">生成</button>
                    </div>

                    <!-- 多段续写模式的控件 -->
                    <div id="multi-node-controls" class="ai-mode-controls" style="display: none;">
                        <div class="form-group">
                            <label for="ai-multi-prompt">发展走向指导:</label>
                            <textarea id="ai-multi-prompt" rows="3" placeholder="例如：主角发现了一个惊天秘密..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="ai-multi-chars">参与角色:</label>
                            <select id="ai-multi-chars" multiple></select> <!-- 角色将动态填充 -->
                        </div>
                        <div class="form-group">
                            <label for="ai-multi-segments">期望段数:</label>
                            <input type="number" id="ai-multi-segments" value="3" min="1" max="10">
                        </div>
                        <button id="ai-generate-multi-btn" class="ai-btn">生成</button>
                    </div>
                </div>
                <div id="node-editor" class="right-panel-section">
                    <div class="toolbar-title" id="node-editor-title">请选择一个节点</div>
                    <div id="node-editor-content">
                        <div class="no-selection">请选择一个节点进行编辑</div>

                        <!-- 这里是不同类型节点的编辑表单，初始隐藏 -->
                        <div id="scene-editor" class="editor-form" style="display: none;">
                            <div class="form-group">
                                <label for="scene-name">场景名称(scene):</label>
                                <input type="text" id="scene-name">
                            </div>
                            <div class="form-group">
                                <label for="scene-cap">场景标题(cap):</label>
                                <input type="text" id="scene-cap">
                            </div>
                            <div class="form-group">
                                <label for="scene-pgrs">剧情进度(pgrs):</label>
                                <input type="number" step="0.1" id="scene-pgrs">
                            </div>
                            <button id="add-dialogue-btn">添加对话节点</button>
                            <!-- 移除更新场景按钮 -->
                            <button id="delete-scene-btn" class="delete-btn">删除场景</button>
                        </div>

                        <div id="dialogue-editor" class="editor-form" style="display: none;">
                            <div class="form-group">
                                <label for="dialogue-id">ID:</label>
                            <input type="number" id="dialogue-id" readonly> <!-- 设置为只读 -->
                        </div>
                        <div class="form-group">
                            <label for="dialogue-chr">角色(chr):</label>
                            <select id="dialogue-chr"></select>
                        </div>
                        <div class="form-group">
                            <label for="dialogue-txt">对话内容(txt):</label>
                            <textarea id="dialogue-txt" rows="4"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="dialogue-next">下一场景(next):</label>
                            <input type="text" id="dialogue-next" placeholder="要跳转的场景名">
                        </div>
                        <div class="form-group" id="action-container">
                            <label>行为(act):</label>
                            <div id="action-list"></div>
                            <div class="action-input">
                                <input type="text" id="action-key" placeholder="函数名">
                                <input type="text" id="action-value" placeholder="参数">
                                <button id="add-action-btn">添加行为</button>
                            </div>
                        </div>
                        <button id="add-option-btn">添加选项</button>
                        <!-- 移除更新对话按钮 -->
                        <button id="delete-dialogue-btn" class="delete-btn">删除对话</button>
                    </div>

                    <div id="option-editor" class="editor-form" style="display: none;">
                        <div class="form-group">
                            <label for="option-text">选项文本(optn):</label>
                            <input type="text" id="option-text">
                        </div>
                        <button id="add-option-dialogue-btn">添加子对话</button>
                        <!-- 移除更新选项按钮 -->
                        <button id="delete-option-btn" class="delete-btn">删除选项</button>
                    </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modal-content-inner"></div> <!-- 修改ID避免冲突 -->
        </div>
    </div>

    <!-- 导入导出模态框 -->
    <div id="import-modal" class="modal">
        <div class="modal-content">
            <span class="close-import">&times;</span>
            <h3>导入对话脚本</h3>
            <textarea id="import-text" rows="15" placeholder="粘贴JSON格式的对话脚本"></textarea>
            <button id="confirm-import-btn">导入</button>
        </div>
    </div>     <script src="globals.js"></script>
    <script src="idManager.js"></script>
    <script src="authManager.js"></script>
    <script src="ui.js"></script>
    <script src="fileManager.js"></script>
    <script src="sceneManager.js"></script>
    <script src="dialogueManager.js"></script>
    <script src="optionManager.js"></script>
    <script src="storageManager.js"></script>
    <script src="dragManager.js"></script>
    <script src="resizerManager.js"></script>
    <script src="main.js"></script>
</body>
</html>
