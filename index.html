<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话树编辑器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>对话树编辑器</h1>
            <div class="header-buttons">
                <button id="new-scene-btn">新建场景</button>
                <button id="import-btn">导入</button>
                <button id="export-btn">导出</button>
                <button id="undo-btn">撤销</button>
                <button id="redo-btn">重做</button>
            </div>
        </header>
        
        <main>
            <div class="panel left-panel">
                <h2>场景列表</h2>
                <div id="scene-list" class="scene-list"></div>
            </div>
            
            <div class="panel middle-panel">
                <h2>对话树</h2>
                <div id="dialogue-tree" class="dialogue-tree"></div>
            </div>
            
            <div class="panel right-panel">
                <h2>节点编辑器</h2>
                <div id="node-editor" class="node-editor">
                    <div class="no-selection">请选择一个节点进行编辑</div>
                    
                    <!-- 这里是不同类型节点的编辑表单，初始隐藏 -->
                    <div id="scene-editor" class="editor-form" style="display: none;">
                        <h3>场景编辑</h3>
                        <div class="form-group">
                            <label for="scene-name">场景名称(scene):</label>
                            <input type="text" id="scene-name">
                        </div>
                        <div class="form-group">
                            <label for="scene-cap">场景标题(cap):</label>
                            <input type="text" id="scene-cap">
                        </div>
                        <div class="form-group">
                            <label for="scene-pgrs">剧情进度(pgrs):</label>
                            <input type="number" step="0.1" id="scene-pgrs">
                        </div>
                        <button id="add-dialogue-btn">添加对话节点</button>
                        <!-- 移除更新场景按钮 -->
                        <button id="delete-scene-btn">删除场景</button>
                    </div>
                    
                    <div id="dialogue-editor" class="editor-form" style="display: none;">
                        <h3>对话编辑</h3>
                        <div class="form-group">
                            <label for="dialogue-id">ID:</label>
                            <input type="number" id="dialogue-id">
                        </div>
                        <div class="form-group">
                            <label for="dialogue-chr">角色(chr):</label>
                            <input type="number" id="dialogue-chr">
                        </div>
                        <div class="form-group">
                            <label for="dialogue-txt">对话内容(txt):</label>
                            <textarea id="dialogue-txt" rows="4"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="dialogue-next">下一场景(next):</label>
                            <input type="text" id="dialogue-next" placeholder="要跳转的场景名">
                        </div>
                        <div class="form-group" id="action-container">
                            <label>行为(act):</label>
                            <div id="action-list"></div>
                            <div class="action-input">
                                <input type="text" id="action-key" placeholder="函数名">
                                <input type="text" id="action-value" placeholder="参数">
                                <button id="add-action-btn">添加行为</button>
                            </div>
                        </div>
                        <button id="add-option-btn">添加选项</button>
                        <!-- 移除更新对话按钮 -->
                        <button id="delete-dialogue-btn">删除对话</button>
                    </div>
                    
                    <div id="option-editor" class="editor-form" style="display: none;">
                        <h3>选项编辑</h3>
                        <div class="form-group">
                            <label for="option-text">选项文本(optn):</label>
                            <input type="text" id="option-text">
                        </div>
                        <button id="add-option-dialogue-btn">添加子对话</button>
                        <!-- 移除更新选项按钮 -->
                        <button id="delete-option-btn">删除选项</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modal-content"></div>
        </div>
    </div>
    
    <!-- 导入导出模态框 -->
    <div id="import-modal" class="modal">
        <div class="modal-content">
            <span class="close-import">&times;</span>
            <h3>导入对话脚本</h3>
            <textarea id="import-text" rows="15" placeholder="粘贴JSON格式的对话脚本"></textarea>
            <button id="confirm-import-btn">导入</button>
        </div>
    </div>
    
    <!-- 替换原有的脚本引用 -->
<script src="globals.js"></script>
<script src="ui.js"></script>
<script src="sceneManager.js"></script>
<script src="dialogueManager.js"></script>
<script src="optionManager.js"></script>
<script src="storageManager.js"></script>
<script src="main.js"></script>
</body>
</html>
