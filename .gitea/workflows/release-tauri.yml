name: Publish Tauri Release

on:
  workflow_dispatch:

env:
  RELEASE_DRAFT: "true"
  RELEASE_PRERELEASE: "false"
  GITEA_TOKEN: ${{ gitea.token }}
  GITEA_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
  RUNNER_TOOL_CACHE: /toolcache

jobs:
  create-release:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - name: Ensure repository files available
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/gitea-release-upload.mjs ]; then
            echo "Repository files already present."
            exit 0
          fi

          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
          fi

          REPO_SERVER="${GITEA_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          REPO_PATH="${GITEA_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          REF_NAME="${GITHUB_REF_NAME:-${GITEA_REF_NAME:-dev}}"

          if [ -z "$REPO_SERVER" ] || [ -z "$REPO_PATH" ]; then
            echo "Missing repository context for fallback checkout."
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          if [ -n "${GITEA_TOKEN:-}" ]; then
            git -c "http.extraHeader=Authorization: token ${GITEA_TOKEN}" clone --depth 1 --branch "$REF_NAME" "$REPO_SERVER/$REPO_PATH.git" "$TMP_DIR/repo"
          else
            git clone --depth 1 --branch "$REF_NAME" "$REPO_SERVER/$REPO_PATH.git" "$TMP_DIR/repo"
          fi
          cp -a "$TMP_DIR/repo/." .
          rm -rf "$TMP_DIR"

      - name: Ensure Gitea Release exists
        env:
          RELEASE_ENSURE_ONLY: "true"
          RELEASE_BODY: |
            SparkArc 的各平台客户端。
            必须部署服务端使用（详见项目主页 README）。

            仅测试尝鲜用途可以直接下载，默认会尝试连接到作者自己的服务端，但并不保证服务持续有效！
        run: node scripts/gitea-release-upload.mjs

  release-android:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
      volumes:
        - android-sdk:/opt/android-sdk
    timeout-minutes: 90
    needs: create-release
    env:
      CARGO_HOME: /opt/android-sdk/ci-cache/cargo
      RUSTUP_HOME: /opt/android-sdk/ci-cache/rustup
      GRADLE_USER_HOME: /opt/android-sdk/ci-cache/gradle
      NPM_CONFIG_CACHE: /opt/android-sdk/ci-cache/npm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl unzip python3 python3-pip default-jdk libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Ensure repository files available
        shell: bash
        run: |
          set -euo pipefail
          if [ -f client/package.json ] && [ -f client/src-tauri/tauri.conf.json ]; then
            echo "Repository files already present."
            exit 0
          fi

          REPO_SERVER="${GITEA_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          REPO_PATH="${GITEA_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          REF_NAME="${GITHUB_REF_NAME:-${GITEA_REF_NAME:-dev}}"

          if [ -z "$REPO_SERVER" ] || [ -z "$REPO_PATH" ]; then
            echo "Missing repository context for fallback checkout."
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          if [ -n "${GITEA_TOKEN:-}" ]; then
            git -c "http.extraHeader=Authorization: token ${GITEA_TOKEN}" clone --depth 1 --branch "$REF_NAME" "$REPO_SERVER/$REPO_PATH.git" "$TMP_DIR/repo"
          else
            git clone --depth 1 --branch "$REF_NAME" "$REPO_SERVER/$REPO_PATH.git" "$TMP_DIR/repo"
          fi
          cp -a "$TMP_DIR/repo/." .
          rm -rf "$TMP_DIR"

      - name: Ensure cache directories exist
        run: |
          mkdir -p "$CARGO_HOME/registry" "$CARGO_HOME/git" "$RUSTUP_HOME" "$NPM_CONFIG_CACHE" "$GRADLE_USER_HOME"

      - name: Configure Gradle network resilience
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME/init.d"

          python3 - <<'PY'
          import os
          from pathlib import Path

          gradle_home = Path(os.environ["GRADLE_USER_HOME"])
          gradle_home.mkdir(parents=True, exist_ok=True)
          (gradle_home / "init.d").mkdir(parents=True, exist_ok=True)

          gradle_properties_lines = [
              "org.gradle.daemon=false",
              "org.gradle.parallel=false",
              "org.gradle.workers.max=2",
              "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3",
              "org.gradle.internal.http.connectionTimeout=120000",
              "org.gradle.internal.http.socketTimeout=120000",
              "org.gradle.internal.repository.max.retries=8",
              "org.gradle.internal.repository.initial.backoff=1000",
              "systemProp.java.net.preferIPv4Stack=true",
              "systemProp.https.protocols=TLSv1.2,TLSv1.3",
              "systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3",
          ]
          (gradle_home / "gradle.properties").write_text(
              "\n".join(gradle_properties_lines) + "\n",
              encoding="utf-8",
          )

          mirror_lines = [
              "allprojects {",
              "  buildscript {",
              "    repositories {",
              "      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }",
              "      maven { url 'https://maven.aliyun.com/repository/google' }",
              "      maven { url 'https://maven.aliyun.com/repository/public' }",
              "      mavenCentral()",
              "      google()",
              "    }",
              "  }",
              "  repositories {",
              "    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }",
              "    maven { url 'https://maven.aliyun.com/repository/google' }",
              "    maven { url 'https://maven.aliyun.com/repository/public' }",
              "    mavenCentral()",
              "    google()",
              "  }",
              "}",
              "",
              "settingsEvaluated { settings ->",
              "  try {",
              "    settings.pluginManagement.repositories {",
              "      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }",
              "      maven { url 'https://maven.aliyun.com/repository/google' }",
              "      maven { url 'https://maven.aliyun.com/repository/public' }",
              "      mavenCentral()",
              "      google()",
              "      gradlePluginPortal()",
              "    }",
              "  } catch (Exception ignored) {",
              "  }",
              "}",
          ]
          (gradle_home / "init.d" / "repository-mirrors.gradle").write_text(
              "\n".join(mirror_lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Setup Android SDK & NDK (cached via Docker volume)
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
          ANDROID_HOME: /opt/android-sdk
        run: |
          # 检测已有 SDK 缓存
          if [ -f "$ANDROID_SDK_ROOT/.cache-marker" ]; then
            echo "✅ Android SDK cached, skipping download"
            NDK_VERSION=$(ls $ANDROID_SDK_ROOT/ndk/ 2>/dev/null | head -1)
            echo "NDK version: $NDK_VERSION"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV
            echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV
            echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
            exit 0
          fi

          echo "⬇️ Downloading Android SDK & NDK..."
          # Android Commandline Tools
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest || true

          # SDK packages
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          # NDK r28
          curl -fsSL https://dl.google.com/android/repository/android-ndk-r28-linux.zip -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndk-extract
          NDK_VERSION=$(grep -oP 'Pkg.Revision\s*=\s*\K[0-9.]+' /tmp/ndk-extract/android-ndk-r28/source.properties)
          echo "NDK version: $NDK_VERSION"
          mkdir -p $ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          mv /tmp/ndk-extract/android-ndk-r28/* $ANDROID_SDK_ROOT/ndk/$NDK_VERSION/

          # 标记缓存完成
          date > $ANDROID_SDK_ROOT/.cache-marker

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Rust stable and Android targets
        shell: bash
        run: |
          set -euo pipefail

          install_rustup() {
            local dist_server="$1"
            local update_root="$2"
            echo "Trying rustup servers: dist=${dist_server}, update=${update_root}"
            export RUSTUP_DIST_SERVER="$dist_server"
            export RUSTUP_UPDATE_ROOT="$update_root"

            for attempt in 1 2 3 4 5; do
              echo "Rustup bootstrap attempt ${attempt}/5"
              if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors https://sh.rustup.rs -o /tmp/rustup-init.sh && \
                 sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable; then
                return 0
              fi
              sleep $((attempt * 6))
            done

            return 1
          }

          if ! command -v rustup >/dev/null 2>&1; then
            install_rustup "https://rsproxy.cn" "https://rsproxy.cn/rustup" || \
            install_rustup "https://static.rust-lang.org" "https://static.rust-lang.org/rustup"
          fi

          source "$CARGO_HOME/env"

          for attempt in 1 2 3 4 5; do
            echo "Rust toolchain install attempt ${attempt}/5"
            if rustup toolchain install stable --profile minimal; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to install rust stable toolchain"
              exit 1
            fi
            sleep $((attempt * 6))
          done

          rustup default stable

          for attempt in 1 2 3 4 5; do
            echo "Rust target add attempt ${attempt}/5"
            if rustup target add aarch64-linux-android; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to add Android rust targets"
              exit 1
            fi
            sleep $((attempt * 6))
          done

          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline

      - name: Check i18n keys
        working-directory: client
        run: npm run i18n:check:strict

      - name: Type check
        working-directory: client
        run: npm run typecheck

      - name: Build launcher
        working-directory: client
        run: npm run build:launcher

      - name: Initialize Android project
        working-directory: client
        run: npm run tauri -- android init

      - name: Install icon processing dependencies
        run: pip3 install -r scripts/requirements-icon.txt -q --break-system-packages

      - name: Prepare app icon from source
        run: python3 scripts/prepare-icon.py

      - name: Regenerate Android icons
        working-directory: client
        run: npm run tauri icon src-tauri/icons/app-icon-source.png

      - name: Patch Android adaptive foreground safe zone
        run: python3 scripts/patch-android-adaptive-foreground.py

      - name: Patch Android manifest and adaptive icon
        shell: bash
        run: |
          # 1. 添加 roundIcon 到 AndroidManifest.xml
          MANIFEST="client/src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android:roundIcon' "$MANIFEST"; then
            sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"|' "$MANIFEST"
          fi

          # 2. 创建 ic_launcher_round.xml
          ROUND_XML="client/src-tauri/gen/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          mkdir -p "$(dirname "$ROUND_XML")"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' \
            '  <background android:drawable="@color/ic_launcher_background"/>' \
            '</adaptive-icon>' > "$ROUND_XML"

          # 3. 确保 ic_launcher_background 颜色为白色
          BG_XML="client/src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml"
          mkdir -p "$(dirname "$BG_XML")"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '  <color name="ic_launcher_background">#fff</color>' \
            '</resources>' > "$BG_XML"

      - name: Warm Gradle cache with retry (best effort)
        working-directory: client/src-tauri/gen/android
        shell: bash
        run: |
          set -uo pipefail
          warmup_ok=0
          for attempt in 1 2 3 4 5; do
            echo "Gradle warmup attempt ${attempt}/5"
            if ./gradlew --no-daemon help --stacktrace --refresh-dependencies; then
              warmup_ok=1
              break
            fi

            sleep $((attempt * 20))
          done

          if [ "$warmup_ok" -eq 1 ]; then
            echo "Gradle warmup succeeded"
          else
            echo "Gradle warmup failed after retries; continue to build retry phase"
          fi

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing Android signing secrets."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sparkarc-release.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/sparkarc-release.jks"
          } > client/src-tauri/gen/android/keystore.properties

          python3 -c '
          from pathlib import Path
          gradle_path = Path("client/src-tauri/gen/android/app/build.gradle.kts")
          text = gradle_path.read_text(encoding="utf-8")
          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\n" + text
          marker = "    defaultConfig {"
          signing_props = "    val keystorePropertiesFile = rootProject.file(\"keystore.properties\")\n    val keystoreProperties = Properties()\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
          if "val keystorePropertiesFile = rootProject.file" not in text:
              text = text.replace(marker, signing_props + marker, 1)
          build_types_marker = "    buildTypes {"
          signing_config = "    signingConfigs {\n        create(\"release\") {\n            keyAlias = keystoreProperties[\"keyAlias\"] as String\n            keyPassword = keystoreProperties[\"password\"] as String\n            storeFile = file(keystoreProperties[\"storeFile\"] as String)\n            storePassword = keystoreProperties[\"password\"] as String\n        }\n    }\n"
          if "create(\"release\")" not in text:
              text = text.replace(build_types_marker, signing_config + build_types_marker, 1)
          release_marker = "        getByName(\"release\") {"
          if "signingConfig = signingConfigs.getByName(\"release\")" not in text:
              text = text.replace(release_marker, release_marker + "\n            signingConfig = signingConfigs.getByName(\"release\")", 1)
          # 只保留 arm64-v8a ABI，移除 x86/x86_64/armeabi-v7a
          ndk_block = "\n            ndk {\n                abiFilters += \"arm64-v8a\"\n            }"
          if "abiFilters" not in text:
              text = text.replace(release_marker, release_marker + ndk_block, 1)
          gradle_path.write_text(text, encoding="utf-8")
          '

      - name: Build Android APK (retry on transient network)
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Android build attempt ${attempt}/5"
            if npm run tauri -- android build --apk --target aarch64; then
              exit 0
            fi

            if [ "$attempt" -ge 2 ]; then
              echo "Refreshing Gradle dependencies before next attempt"
              (cd src-tauri/gen/android && ./gradlew --no-daemon --stacktrace help --refresh-dependencies) || true
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Android build failed after 5 attempts"
              exit 1
            fi

            sleep $((attempt * 20))
          done

      - name: Upload Android APK to Gitea Release
        env:
          GITEA_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: node scripts/gitea-release-upload.mjs client/src-tauri/gen/android/app/build/outputs/apk
