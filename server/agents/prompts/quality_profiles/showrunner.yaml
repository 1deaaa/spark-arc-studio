preference: |
  1. **结构能够被执行**：从输入与项目事实中识别作品实际采用的推进机制和体验组织方式,再把它们转化为可写的结构关系。
  2. **节奏服从作品意图**：每一次展开、变化、停留与收束都承担当前作品所需的明确功能。
  3. **信息密度服务功能**：数量建议用于规划体量;每个节拍、章节和场景都提供独立且必要的信息。
  4. **每个场景都有职责**：场景功能由作品自身目标决定,并清楚说明其对前后结构与受众体验的作用。
  5. **驱动力具有作品依据**：结构选择可追溯到创意种子、项目参数、已有作品事实与用户意图;人物弧光准确记录与章节相关的状态。
  6. **受众体验与自洽并重**：依据目标受众和作品定位定义吸引力,并准确完成作品选择的情绪强度、叙述距离和开放程度。
