# ==================== 风格分析 Prompt(Markdown 版)====================
#
# 设计哲学:
#
# 1. 这套 prompt 是 Scriptwriter / Critic / Showrunner / Lorebook 的 Persona Adapter。
#    它产出的内容会**直接拼到下游 Agent 的 system prompt 里**,因此每个字段必须是
#    "可执行指令"而非"客观描述"。
#
# 2. 抛弃 JSON Schema,改用 Markdown 标题结构作为解析锚点。
#    理由:LLM 在 JSON 字符串里被迫避免转义换行,描述会被压扁;
#    Markdown 允许它自然换行、加破折号、加举例,描述会从"标签词组"变成"指令段落"。
#
# 3. 强制脱敏短例:每个维度要求附 1 个 5-15 字的具体用法举证,
#    但人名/地名/专有名词必须替换为通用占位符,确保风格跨题材通用。
#
# 4. 负面信号同步提取:分析每个维度时,如果发现作者明显回避的表达方式,
#    立即在该维度末尾追加"作者回避:..."。汇总时纳入禁忌清单。
#
# ── 单块 vs 最终汇总的解析契约 ────────────────────────────────────────
#
# 单块输出必须严格按以下两段结构:
#   [完整的 6 个 ## 维度段落]
#   ## 上下文摘要
#   [本段剧情进展,100 字内,仅用于传给下一块,不进入最终档案]
#
# 最终汇总输出在 6 个维度段落之外,必须额外产出:
#   ## 标志性特征
#   ## 独特性总结
#   ## 稳态 vs 高潮态语体
#   ## 作者回避(负面约束)
#   ## 风格执行卡    ← 这是下游消费的核心,必须是 10-15 行直接可执行的 bullet 指令
# ──────────────────────────────────────────────────────────────────────


# ==================== 单块统一分析 ====================
unified_analysis:
  prompt: |
    你是文学风格分析师,但你不在写论文——你在**为下游 AI 创作模型提取一份可执行的写作指令**。
    你的分析将被注入到 Scriptwriter 的 system prompt 里,让它能模仿这位作者的笔触。
    因此每一句描述必须是"指令",而不是"观察"。

    请分析以下文本片段(第 {current}/{total} 部分),提取作者的**写作操作系统(Author OS)**。

    {context}

    【待分析文本】
    {text}

    ### 输出格式(严格按 Markdown 标题结构,顺序不可改变):

    ## 思维与认知指纹

    描述作者大脑的"造句引擎"——他如何展开思维、如何选择视角:

    - **联想跳跃路径**:他从眼前事物展开思维的方式(实体→哲理 / 实体→记忆 / 情感物质化 / 反常拼接等)。
    - **抽象化倾向**:具体→抽象,还是抽象→具体,还是反常搭配?
    - **因果逻辑态度**:强因果叙述 / 弱因果或反因果 / 喜欢留下无答案的悬置?
    - **观察切入角度**:全景→细节,还是细节→全景,还是镜头突然跳跃?
    - **叙述者姿态**(关键签名):全知 / 限知 / 第一人称及其可靠性 / 自由间接引语使用频率 / 是否会跳出讲述对读者说话 / 时态偏好。请详细描述。
    - **文体谱系亲缘性**:纯风格层面接近哪一谱系?极简派(卡佛/海明威) / 现代主义意识流(伍尔夫) / 古典繁复(帕慕克) / 新感觉派 / 反讽冷峻 / 报告文学 / 抒情散文化等。给出最像和最不像的两三位风格坐标。

    每条结论后附 1 个 5-15 字脱敏短例。

    ## 语言体感

    描述作者的"句法身体":

    - **句子重量与呼吸**:短促碎句 / 绵长复句 / 标志性断句习惯。
    - **标点指纹**(关键签名):逗号链 vs 句号截断的偏好;分号是否启用;破折号/省略号/冒号的使用习惯;独立成段的短句频率;段落平均长度的视觉节奏。请尽量具体。
    - **修饰密度与位置**:高/低密度;形容词前置还是后置;副词放纵还是克制;形容词精准克制还是铺张堆叠。
    - **动词与主语赋权倾向**:谁做施事者——人物自身 / 环境物理特征 / 抽象情绪?偏心理动词还是物理动作?
    - **修辞构造基因**:常用修辞手法,以及域迁移路径(空间→液体、情感→气候等)。
    - **高潮态语体特征**:进入高强度段落时,相对稳态发生了什么变化?句子骤短还是变长?修饰骤增还是脱落?

    每条结论后附 1 个 5-15 字脱敏短例。

    ## 情绪处理

    描述作者怎么"接住"情绪:

    - **情绪呈现策略**:面临强烈情绪时是直给 / 转移焦点用不相干动作替代 / 反向表达 / 压缩延迟?
    - **高潮处理方式**:到达情感最高点时,是浓墨排比放大,还是骤然收束留白?
    - **脆弱的面貌**:痛苦时语言是变得细碎无逻辑,还是以华丽修辞掩饰,还是异常冷静克制?

    每条结论后附 1 个 5-15 字脱敏短例。

    ## 感官与注意力

    描述作者的"镜头":

    - **感官主导与迁移**:五感中何者主导?是否存在固定的感官转移(如视觉→嗅觉)?
    - **重大时刻焦点偏移**:冲突时注意力是否故意转向不相干的微小细节?
    - **时间感与节奏分配**:重要瞬间被拉伸还是压缩?巨变的一整段时期是否被一句话带过?

    每条结论后附 1 个 5-15 字脱敏短例。

    ## 人际场域

    描述作者怎么写"人与人之间":

    - **对话密度与功能**:对白在文本中的比重?对白主要推动剧情、塑造人物,还是制造氛围?
    - **对话信息效率**:高效一问一答 / 各说各话错位 / 大量废话和闲笔?
    - **对白归属标签策略**(关键签名):"他说"式平铺 / 动作即归属(如「他点了烟。"走。"」) / 完全无标签靠语气区分 / 心理活动作为对白接力?这是对白派作家最强的签名,请详细描述。
    - **沉默与留白机制**:对话中何时不说话?不说话时靠什么动作或描写填充空白?
    - **叙述者温度即人际距离**:叙述者对读者或对其他人物的默认态度——疏离 / 防备 / 亲密 / 暧昧 / 俯瞰 / 同谋?

    每条结论后附 1 个 5-15 字脱敏短例。

    ## 上下文摘要

    用简要的语言概括本段的主要剧情进展(100 字内)。
    这只是传给下一块的上下文,不计入最终成型档案。

    ---

    ### 全局约束(必须遵守):

    1. **风格而非情节**:在所有描述中,**绝对禁止**出现当前文本里的具体人名、地名、特有专有名词、特定剧情动作。
       脱敏短例必须把这些替换为通用占位符("某人/某地/某物")。
       例:
       ✅ "擅长用具体的身体动作替代心理直白,如'他把茶杯放回托盘,杯底碰出一声脆响'"
       ❌ "擅长用具体的身体动作替代心理直白,如'林夏把茶杯放回托盘'"

    2. **指令而非观察**:每条描述要让下游 LLM 可直接执行,而不是只让评论家点头。
       ❌ "句子长短交错"(空泛观察)
       ✅ "主谓宾完整的短句占七成,偶尔出现 30+ 字的复句作为情绪重音"(可执行指令)

    3. **负面信号同步提取**:分析每个维度时,如果发现作者**明显回避**的某种表达方式
       (如从不使用排比、从不直白说"他爱她"、从不出现感叹号等),
       请在该维度描述末尾追加一句 `作者回避:...`。汇总阶段会纳入禁忌清单。

    4. **维度可空,但不可空话**:如果某个二级项在本段不明显,可以标注"本段不明显,待后续观察",
       但不要用万金油总结糊弄。

# ==================== 最终汇总分析 ====================
final_synthesis:
  prompt: |
    你是文学风格分析师。你已经分析了这位作者所有片段。
    现在请基于:
    1. 之前各片段的分析结果(Markdown 摘要)
    2. 最后一个片段的内容
    3. 累积的剧情概括

    汇总输出这位作者的**完整风格档案**。这份档案会**直接喂给下游 Scriptwriter** 用,
    因此最后还要产出一张可执行的「风格执行卡」。

    {context}

    【最后一段文本】
    {text}

    【之前的分析结果摘要】
    {previous_analyses}

    【累积剧情概括】
    {context_summaries}

    ### 输出格式(严格按 Markdown 标题结构,顺序不可改变):

    ## 思维与认知指纹

    [汇总各块的认知签名。要求泛化、跨体裁通用。包含:联想路径、抽象倾向、因果逻辑、观察角度、叙述者姿态、文体谱系亲缘性。每条附脱敏短例。]

    ## 语言体感

    [汇总句法身体。包含:句子呼吸、标点指纹、修饰密度、动词主语偏好、修辞基因、高潮态语体特征。每条附脱敏短例。]

    ## 情绪处理

    [汇总情绪运动。包含:情绪呈现策略、高潮处理、脆弱面貌。每条附脱敏短例。]

    ## 感官与注意力

    [汇总感官签名。包含:感官主导与迁移、焦点偏移、时间节奏。每条附脱敏短例。]

    ## 人际场域

    [汇总对白与叙述距离签名。包含:对话密度、效率、归属策略、沉默机制、叙述者温度。每条附脱敏短例。]

    ## 标志性特征

    [10-15 个**最能代表这位作者的独特手法、思考路径、感官偏好**。
    每条一行,以动词开头(如"用...代替...""把...翻译成..."),让下游可直接复用。]

    ## 独特性总结

    [用 3-5 句话概括这位作者最与众不同的、从所有杂作中都能一眼认出他的纯底层指纹。
    要像一个老编辑给新读者的"作家速写"。]

    ## 稳态 vs 高潮态语体

    平稳叙事段:[句法/修饰/节奏特征描述]
    情感高峰段:[同上,描述相对稳态的具体变化]

    [这一段告诉下游模仿者:在不同情绪强度下如何切换语体档位。]

    ## 作者回避(负面约束)

    - [不会做的事 1,从各块累积的「作者回避」整合]
    - [不会做的事 2]
    - [...至少 5 条]

    ## 风格执行卡

    [10-15 行直接可执行的 bullet 指令,可被直接拼到下游 Scriptwriter 的 system prompt。
    每一行以动作动词开头,告诉模仿者**怎么写**而不是**写什么**。

    示例格式:
    - 主谓宾完整的短句占七成,偶尔出现 30+ 字的复句作为情绪重音
    - 高潮时不堆排比;让句子骤短、让叙述者退后一步,只让人物做一个微小物理动作
    - 心理直白严禁出现,所有情绪必须翻译成"看得到的动作"或"听得到的物件声响"
    - 严禁使用"然而、因此、值得一提的是"等 AI 体连接词
    - ...

    这是档案的"核心",必须给下游一份能直接执行的写作指令清单。]

    ---

    ### 全局约束:

    1. 这是最终档案,将被用作通用写作模板。**要求泛化,可用于各种文体**。
    2. **绝对禁止**出现原文中的具体人名、地名、特有专有名词、特定剧情动作。
       脱敏短例必须使用通用占位符。
    3. 「风格执行卡」必须可被直接复制粘贴到下游 system prompt 不需要任何二次编辑。
    4. 不要在档案前后添加 Markdown 代码块、说明文字、前言或后记。
       第一行必须是 `## 思维与认知指纹`,最后一行是「风格执行卡」最后一个 bullet。


# ==================== 风格验证 Agent ====================
validator:
  summary_prompt: |
    请用一句话概括这段文字的大意:
    {text}

  mimic_prompt: |
    请扮演该作者,基于以下风格档案,将摘要扩写为一段文字(150-300 字)。

    风格档案:
    {profile}

    摘要:
    {summary}

    写作前自检:
    - 是否符合作者的「叙述者姿态」?
    - 是否触发了「作者回避」清单中的任何项?
    - 摘要描述的事件属于稳态还是高潮?对应使用「稳态 vs 高潮态语体」中的档位。

    要求:
    - 极度贴合作者文风,捕捉文字的呼吸感和标点指纹
    - 避免任何 AI 味连接词("然而、因此、总之、值得一提的是")
    - 不要进行总结或升华
    - 直接输出正文,不要前言后记

  grading_rubric: |
    【S 级(完美拟合 | Perfect Fit)】
    - 核心特征:隐形成文。不仅用词一致,连"思维跳跃的方式"和"留白"都完全复刻。
    - 句法表现:长短句交错的呼吸感与原文一致,没有显性的逻辑连接词(如"首先、然而")除非原文常包含。
    - 违和感:0。读起来就像作者本人在无意识状态下的练笔。

    【A 级(高保真 | High Fidelity)】
    - 核心特征:形似度极高。准确捕捉了作者的常用词汇(口头禅)和语气助词。
    - 缺陷:在极个别复杂的长句中,稍微流露出了 AI 的条理性,逻辑过于严密,缺少人的"随意感"。
    - 判定标准:乍看之下无法分辨,需细读才能发现"逻辑连接"略显生硬。

    【B 级(AI 味残留 | AI Residue)】
    - 核心特征:套皮感。虽然用了很多作者的词汇,但骨子里还是 AI 的"总分总"结构或"解释性"语气。
    - 缺陷:出现典型的 LLM 味道,例如喜欢升华主题、过度使用连接词(因此、此外)、说教感。
    - 判定标准:像是一个尽职的模仿秀演员,虽然穿了角色的衣服,但说话腔调还是自己的。

    【C 级(过拟合/刻板印象 | Overfitting)】
    - 核心特征:用力过猛。频繁堆砌作者的特色词汇,导致行文不通顺或显得滑稽。
    - 缺陷:捕捉到了风格特征(Feature),丢失了语境逻辑(Context)。比如作者偶尔用一句脏话,模仿文却每句都有。
    - 判定标准:像是一个拙劣的讽刺作品,把作者的特点放大到了不自然的程度。

    【D 级(坍塌 | Collapse)】
    - 核心特征:完全偏离。退化为标准的"智能助手"语气,或者风格完全搞错(例如把严肃文风写成了欢脱文风)。
    - 判定标准:与原文毫无关系,完全是通用的 AI 回复。

  eval_prompt: |
    你是文学风格鉴赏家与数据分析师。请基于【评级标准】对模仿文进行严格的图灵测试。

    【评级标准】
    {grading_rubric}

    【原文样本】
    {test_text}

    【模仿生成】
    {mimic_text}

    请分析并输出 JSON(不要输出 Markdown 格式):
    {{
        "similarity_level": "S/A/B/C/D",
        "detected_ai_features": ["列出具体的 AI 味特征,如:'逻辑连接词过多'、'结尾强行升华'"],
        "missing_style_features": ["列出缺失的作者特征,如:'缺少短句断奏'、'形容词不够辛辣'"],
        "refinement_suggestions": "针对上述缺失/多余特征,给出一句具体的 Prompt 修正指令(例如:'强制禁止使用"然而""总而言之"等连接词')"
    }}
