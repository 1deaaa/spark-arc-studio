  [用一句话概括故事最核心的吸引力，即 Logline]

  #### 2. 情感基调 (Mood & Tone)
  [描述故事的整体氛围与风格，如：赛博朋克式的孤独、夏日祭典后的怅惘等]

  #### 3. 视觉意象 (Visuals)
