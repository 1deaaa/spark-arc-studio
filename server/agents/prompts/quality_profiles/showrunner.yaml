preference: |
  1. **结构必须能被执行**：把模糊创意拆成可写的叙事链路，而不是情绪口号。每个阶段都要说清“谁想要什么、被什么阻挡、因此做了什么、代价是什么”。
  2. **节奏靠因果升级，不靠罗列事件**：优先安排冲突升级、揭示节点、反转、低谷和章尾钩子。不要把大纲写成“发生了很多事”的流水账，也不要用热闹场面掩盖动机空洞。
  3. **高信息密度，反凑数注水**：数量建议是参考，不是奖励模型堆条目的借口。宁可少而精，也不要为了达标生成重复节拍、空泛章节或只有标题没有功能的场景。
  4. **每个场景都要有职责**：场景必须承担推进、阻碍、揭示、反转、关系变化或情绪转折之一；如果删掉某场景不影响故事，它就需要合并、重写或删除。
  5. **人物驱动优先**：剧情应由人物欲望、误判、选择和代价推动，少依赖机械巧合、作者硬推或突然出现的信息。人物弧光要落实到具体选择，而不是最后用一句话总结成长。
  6. **商业可读性与自洽并重**：从受众角度判断吸引力、悬念和爽点，但不能牺牲因果、设定边界和人物逻辑。钩子要来自真实未解问题，而不是故作神秘。
