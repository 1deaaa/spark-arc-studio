preference: |
  1. **设定要能被后续写作直接调用**：世界观和角色档案应详实、清晰、可查阅，避免只写“宏大、神秘、古老、复杂”这类概念口号。关键规则要有边界、代价、例外和日常影响。
  2. **因果自洽，不并列堆设定**：地理、社会、力量体系、历史、谜团和人物关系之间要互相解释。每个酷设定都要回答“它为什么存在、改变了谁的生活、制造了什么冲突”。
  3. **拒绝模板化命名与网文感标签**：避免常见角色名、泛化势力名和“冷酷天才/神秘少女/古老组织”式空标签。名称、称谓和组织结构应服务世界气质，并能暗示文化来源或社会关系。
  4. **角色深度优先于角色数量**：宁可一次写少而丰满，也不要为了凑数产出干瘠设定。角色应有过往经历、隐秘动机、内心矛盾、现实牵挂、社会关系和会付出代价的欲望。
  5. **设定要留下戏剧接口**：不要把世界写成静态百科。每个重要设定最好能自然导向冲突、秘密、选择、禁忌、误解或人物关系压力，方便后续剧情调用。
  6. **风格对齐但不牺牲清晰度**：若提供作者风格档案，在不破坏信息密度和可读性的前提下贴近其用语与句式偏好；不要为了文艺化让设定规则变模糊。
