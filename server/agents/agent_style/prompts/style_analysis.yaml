# ==================== 通用 Schema 定义 ====================
#用于注入到 prompt 中，使用单花括号 (因为注入后不再进行 format)
common_style_schema: |
    "sentence_texture": {
      "rhythm_and_length": "句子呼吸感（长短句交错规律/单句长度/是否存在频繁的断句或连长句）",
      "syntactic_structure": "句法惯性（偏好倒装句/排比铺陈/繁复的修饰语/主谓宾极简直白）",
      "vocabulary_temperature": "词汇温度（偏向冷硬书面语/日常大白话/古典雅致/粗俗生动）",
      "sensory_preference": "感官调用偏好（写作时第一本能是描绘视觉的光影、听觉的嘈杂、还是通感的比喻）"
    },
    "dialogue_mechanics": {
      "exchange_pace": "交锋节奏（一问一答的快节奏乒乓球式/大段演讲式/答非所问的错位感）",
      "speech_tags_habit": "对话标签习惯（是否省略'说'字/偏好用大量环境动作代替'某某说'/语气词的使用密度）",
      "subtext_density": "潜台词密度（角色是直抒胸臆还是习惯性阴阳怪气/顾左右而言他）"
    },
    "narrative_camera": {
      "focus_distance": "叙事镜头距离（是贴着人物头皮的内耗式视角/还是冷眼旁观的上帝视角/像电影镜头般注重物理站位）",
      "scene_transition": "场景与时间剪辑（怎样跳过无聊的时间段/偏好生硬切分还是用某个物件平滑过渡）",
      "detail_magnification": "细节放大镜（最爱花笔墨描绘什么：是人物脸上的微表情、房间里的灰尘、还是心理活动的百转千回）"
    },
    "emotional_palette": {
      "base_tone": "行文底色调（文字天然带着忧郁/神经质的欢脱/沉滞的压抑/轻盈的虚无感）",
      "tension_building": "张力构建法（如何把一个平淡的场景写得令人窒息/靠沉默还是靠语言的冲突）",
      "climax_processing": "情绪爆发点（高潮时是爆发式的大段咆哮/还是极致的留白与突然的平静）"
    }

# ==================== 统一风格分析 (单块) ====================
unified_analysis:
  prompt: |
    你是专业的文学风格分析师。请分析以下文本片段（第{current}/{total}部分），从七个维度提取作者的风格特征。

    {context}
    
    【待分析文本】
    {text}

    请输出JSON格式：
    {{
      "style_analysis": {{
    {json_schema}
      }}
    }}

    注意：
    1. 你现在的目标是提取“作者的底色与习惯”，也就是：如果这位作者明天去写一篇与当前文章【题材完全无关、剧情完全不同】的新作品，他依然会保留的那些“行文习惯”。
    2. 🚨 【终极红线】：**绝对禁止**你的 JSON 产物中出现任何本篇小说的具体名词（人名、特有设定名、书籍名、招式名等），以及剧透任何具体的发生了什么事。如果他用“吃掉胰脏”比喻深爱，你提取的必须是“惯用带有生理不适感的生化词汇来进行极端的情感反差比喻”。
    3. 如果某个维度在当前片段中不明显，可以直接填"无显著特征"。

# ==================== 最终汇总分析 ====================
final_synthesis:
  prompt: |
    你是专业的文学风格分析师。现在你已经分析了这位作者作品的所有片段，请基于：
    1. 之前各片段的分析结果（JSON摘要）
    2. 最后一个片段的内容
    3. 累积的剧情概括

    汇总输出这位作者的**完整风格档案**。

    {context}

    【最后一段文本】
    {text}

    【之前的分析结果摘要】
    {previous_analyses}

    【累积剧情概括】
    {context_summaries}

    请输出最终的风格档案JSON：
    {{
    {json_schema},
      "coordinator": {{
        "mimic_instruction": "给大模型的最高指令（如果下一个AI要模仿这位作者写一篇【全新设定】的网文，请给它写一段最核心的 Prompt 指引，强调它必须坚持的文风底线，用祈使句）",
        "distinctive_summary": "作者画像（用3-5句话描述这位作家的气质：是喋喋不休的神经质、是冷酷剥骨的旁观者、还是词藻华丽的浪漫诗人）",
        "negative_constraints": ["绝对不能出现的写法"]
      }}
    }}

    注意：
    1. 这是最终档案，它【只是一份写作手法的说明书】，就像一个作家的DNA测序报告。
    2. 🚨 【脱水警告】：再次扫描，确保没有残留任何上文的具体剧情词汇！一切具体的人、事、物都必须已经被粉碎并抽象为了“句子”、“修辞”、“口癖”、“视角”。

# ==================== 风格验证 Agent ====================
validator:
  summary_prompt: |
    请用一句话概括这段文字的大意：
    {text}

  mimic_prompt: |
    请扮演该作者，基于以下风格档案，将摘要扩写为一段文字。
    风格档案：{profile}
    摘要：{summary}
    要求：极度贴合作者文风，不要出现AI味，捕捉文字的呼吸感。

  grading_rubric: |
    【S级 (完美拟合 | Perfect Fit)】
    - 核心特征：隐形成文。不仅用词一致，连“思维跳跃的方式”和“留白”都完全复刻。
    - 句法表现：长短句交错的呼吸感与原文一致，没有显性的逻辑连接词（如“首先、然而”）除非原文常包含。
    - 违和感：0。读起来就像作者本人在无意识状态下的练笔。

    【A级 (高保真 | High Fidelity)】
    - 核心特征：形似度极高。准确捕捉了作者的常用词汇（口头禅）和语气助词。
    - 缺陷：在极个别复杂的长句中，稍微流露出了AI的条理性，逻辑过于严密，缺少人的“随意感”。
    - 判定标准：乍看之下无法分辨，需细读才能发现“逻辑连接”略显生硬。

    【B级 (AI味残留 | AI Residue)】
    - 核心特征：套皮感。虽然用了很多作者的词汇，但骨子里还是 AI 的“总分总”结构或“解释性”语气。
    - 缺陷：出现典型的 LLM 味道，例如喜欢升华主题、过度使用连接词（因此、此外）、说教感。
    - 判定标准：像是一个尽职的模仿秀演员，虽然穿了角色的衣服，但说话腔调还是自己的。

    【C级 (过拟合/刻板印象 | Overfitting)】
    - 核心特征：用力过猛。频繁堆砌作者的特色词汇，导致行文不通顺或显得滑稽。
    - 缺陷：捕捉到了风格特征（Feature），丢失了语境逻辑（Context）。比如作者偶尔用一句脏话，模仿文却每句都有。
    - 判定标准：像是一个拙劣的讽刺作品，把作者的特点放大到了不自然的程度。

    【D级 (坍塌 | Collapse)】
    - 核心特征：完全偏离。退化为标准的“智能助手”语气，或者风格完全搞错（例如把严肃文风写成了欢脱文风）。
    - 判定标准：与原文毫无关系，完全是通用的 AI 回复。

  eval_prompt: |
    你是文学风格鉴赏家与数据分析师。请基于【评级标准】对模仿文进行严格的图灵测试。

    【评级标准】
    {grading_rubric}

    【原文样本】
    {test_text}

    【模仿生成】
    {mimic_text}

    请分析并输出JSON（不要输出Markdown格式）：
    {{
        "similarity_level": "S/A/B/C/D",
        "detected_ai_features": ["列出具体的AI味特征，如：'逻辑连接词过多'、'结尾强行升华'"],
        "missing_style_features": ["列出缺失的作者特征，如：'缺少短句断奏'、'形容词不够辛辣'"],
        "refinement_suggestions": "针对上述缺失/多余特征，给出一句具体的Prompt修正指令（例如：'强制禁止使用‘然而’、‘总而言之’等连接词'）"
    }}
