<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SparkArc Logo Preview</title>
<style>
body{margin:0;background:#1a1a1a;display:flex;flex-wrap:wrap;gap:24px;padding:24px;font-family:sans-serif;color:#888}
.box{display:flex;flex-direction:column;align-items:center;gap:8px}
.s512{width:512px;height:512px}
.s256{width:256px;height:256px}
.s128{width:128px;height:128px}
.s64{width:64px;height:64px}
.s32{width:32px;height:32px}
.s16{width:16px;height:16px}
img{display:block;background:transparent}
label{font-size:12px}
</style></head><body>
<div class="box"><img class="s512" src="logo.svg"><label>512px · Hero</label></div>
<div class="box"><img class="s256" src="logo.svg"><label>256px · App Icon</label></div>
<div class="box"><img class="s128" src="logo.svg"><label>128px · Dock</label></div>
<div class="box"><img class="s64" src="logo.svg"><label>64px · Toolbar</label></div>
<div class="box"><img class="s32" src="logo.svg"><label>32px · Tab</label></div>
<div class="box"><img class="s16" src="logo.svg"><label>16px · Favicon</label></div>
</body></html>
