# Alembic Migration Configuration
# Supports multiple databases: users.db and llm_config.db

[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[users]
script_location = alembic
version_locations = alembic/versions/users
sqlalchemy.url = driver://user:pass@localhost/dbname
path_separator = os

[llm]
script_location = alembic
version_locations = alembic/versions/llm
sqlalchemy.url = driver://user:pass@localhost/dbname
path_separator = os
