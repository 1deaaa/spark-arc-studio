# ============================================================
# SparkArc Docker Compose 配置
# ============================================================
# 使用方法：
#   1. （可选 前端自动要求设置）复制 server/.env.example 为 server/.env 并填写 LLM_KEY
#   2. 运行: docker compose up -d
#   3. 访问: http://localhost:7788
# ============================================================

services:
  sparkarc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparkarc
    ports:
      # 宿主机端口 7788 映射到容器 6688
      # 区分环境：Docker=7788，裸机=6688，便于同时运行和调试
      - "7788:6688"
    dns:
      # 公网环境若出现 DNS 解析失败，可在此指定可靠 DNS
      - 223.5.5.5
      - 223.6.6.6
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - LLM_KEY=${LLM_KEY:-}
    volumes:
      # ====================================
      # 持久化数据挂载 - 数据存在宿主机的server目录下 请勿修改本仓库的server目录！
      # ====================================
      # 核心数据 (users.db, notices.json)
      - ./server/data:/app/server/data
      
      # 用户创作数据
      - ./server/_userdata:/app/server/_userdata
      
      # 分享和版本快照
      - ./server/shares_data:/app/server/shares_data
      
      # LLM 配置 (llm_config.db, llm_mgr_cfg.yaml)
      # 挂载整个目录以便同时持久化数据库和配置文件
      - ./server/llm/llm_mgr:/app/server/llm/llm_mgr
      
      # LLM_KEY 自动写入 llm_mgr/.env（无需单独挂载）
      
    restart: unless-stopped
