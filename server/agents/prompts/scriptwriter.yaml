# .arc 格式示例
arc_example: |
  [-1]
  午后的阳光透过落地窗洒进来，在木质地板上投下斑驳的光影。我无意识地搅动着杯中的咖啡，银匙碰撞杯壁发出清脆的声响。

  [0]
  今天的拿铁比平时淡了一些。

  [-1]
  门口的风铃轻响，一个身影逆着光走了进来。她在桌边停下，投下一片阴影。

  [1]
  这个位置有人吗？

  <choice>
    <opt text="抬头微笑">
      [-1]
      我放下手中的杯子，抬起头。她手中紧紧攥着一本泛黄的旧书，指节有些发白。

      [0]
      请便。
    </opt>
    
    <opt text="假装没听见">
      [-1]
      我没有理会，只是低下头，视线重新聚焦在手机屏幕上，手指机械地滑动着页面。
      
      [1]
      看来你不太擅长演戏呢。
      
      [-1]
      一声轻笑从头顶传来，带着几分戏谑。
    </opt>
  </choice>
