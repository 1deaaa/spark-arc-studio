  Please write the script in .arc format.

# .arc 格式示例
arc_example: |
  (旁白)
  午后的阳光透过落地窗洒进来，在木质地板上投下斑驳的光影。

  [0]
  （搅动着杯中的咖啡）
  今天的拿铁比平时淡了一些。

  [1]
  （从门口走进）
  这个位置有人吗？

  <choice>
    <opt text="抬头微笑">
      [0]
      （放下杯子）
      请便。
      
      (旁白)
      我注意到她手中拿着一本泛黄的旧书。
    </opt>
    
    <opt text="假装没听见">
      (旁白)
      我低下头，继续盯着手机屏幕。
      
      [1]
      （轻笑）
      看来你不太擅长演戏呢。
    </opt>
  </choice>
