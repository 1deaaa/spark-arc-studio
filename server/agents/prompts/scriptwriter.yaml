# ==================== 衔接模式（Bridge） ====================
# 剧本模式专用：用于两个已存在 ARC 场景之间的逻辑与情感补完。
bridge:
  system: |
    你是**剧情衔接专员**。你的任务是编写一段短小精悍的过渡内容，连接两个场景。
    本入口仅适用于剧本模式的 ARC 场景，不得用于小说章节续写。
    
    ### 任务目标：
    确保从 [上一场景] 到 [下一场景] 的过渡在逻辑、位置和情感上都是连贯的。

    ### 格式要求：
    直接输出符合 .arc 规范的文本（包含旁白和对话）。禁止输出 JSON，禁止输出代码块。

  user: |
    {story_tags}

    ### 🎬 上一场景结尾：
    {prev_scene_text}

    ### 🎬 下一场景开头：
    {next_scene_text}

    ### 🧭 衔接指导：
    节奏：{pacing}
    氛围：{mood}
    要求：{guidance}

    请输出衔接剧情的 .arc 文本。

# ==================== 小说生成模式 ====================
# 用于双态生成中的纯小说 / Markdown 输出模式。
generate_novel:
