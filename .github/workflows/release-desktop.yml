name: Publish Desktop Release

on:
  push:
    tags:
      - 'sparkarc-v*'
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft first
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark this release as a pre-release
        required: true
        default: false
        type: boolean
      version:
        description: 'Version to release (e.g. 0.2.0). Leave empty to use current version in tauri.conf.json'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: "--bundles nsis"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set version
        if: inputs.version != '' || github.ref_type == 'tag'
        working-directory: client
        env:
          RELEASE_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
        run: |
          node scripts/set-release-version.mjs

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Check i18n keys
        working-directory: client
        run: npm run i18n:check:strict

      - name: Type check
        working-directory: client
        run: npm run typecheck

      - name: Run unit tests
        working-directory: client
        run: npm run test

      - name: Setup Python for icon processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/requirements-icon.txt

      - name: Install icon processing dependencies
        run: pip install -r scripts/requirements-icon.txt -q

      - name: Prepare app icon from source
        run: python scripts/prepare-icon.py

      - name: Regenerate platform icons
        working-directory: client
        run: npm run tauri icon src-tauri/icons/app-icon-source.png

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tauriScript: npm run tauri
          tagName: sparkarc-v__VERSION__
          releaseName: SparkArc Studio v__VERSION__
          releaseBody: |
            SparkArc client builds for supported desktop platforms.
            A working backend deployment is required. See the repository README for setup details.

            Windows users must download the file ending in `_x64-setup.exe`. It is the installer and includes Start Menu, desktop shortcut, and startup registration. Do not distribute the bare `target/release/sparkarc.exe` executable.

            These release artifacts are intended for self-hosting, evaluation, and integration testing.
            Default connectivity assumptions may change over time and should not be treated as a guaranteed hosted service.
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}
