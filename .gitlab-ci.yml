stages:
  - build
  - test
  - deploy

variables:
  # Docker 连接配置
  DOCKER_HOST: "tcp://host.docker.internal:2375"
  DOCKER_TLS_CERTDIR: ""
  # 镜像和容器命名
  IMAGE_TAG: "sparkarc:local"
  CONTAINER_NAME: "sparkarc"
  # 数据卷
  DATA_VOLUME: "sparkarc_userdata"
  DB_VOLUME: "sparkarc_db"

# ============================================================
# 阶段1: 构建镜像
# ============================================================
# 包含：前端编译 + 后端依赖安装
# 如果前端编译失败或依赖安装失败，这里会直接报错
# ============================================================
build:
  stage: build
  image: docker:27.5.1
  tags:
    - docker
  script:
    - echo "🔨 开始构建镜像..."
    - docker build -t $IMAGE_TAG .
    - echo "✅ 镜像构建完成"

# ============================================================
# 阶段2: 测试
# ============================================================
# 验证运行时：模块能否正确加载（捕获 import 错误）
# 将来可扩展：pytest 单元测试
# ============================================================
test:
  stage: test
  image: docker:27.5.1
  tags:
    - docker
  script:
    - echo "待添加测试"
    #
    # ==== 将来添加 pytest ====
    # - docker run --rm $IMAGE_TAG pytest server/test/ -v

# ============================================================
# 阶段3: 部署
# ============================================================
deploy:
  stage: deploy
  image: docker:27.5.1
  tags:
    - docker
  script:
    - echo "🚀 开始部署..."
    - docker volume create $DATA_VOLUME || true
    - docker volume create $DB_VOLUME || true
    - docker rm -f $CONTAINER_NAME || true
    - |
      docker run -d \
        --name $CONTAINER_NAME \
        -p 6688:6688 \
        -v $DATA_VOLUME:/app/server/_userdata \
        -v $DB_VOLUME:/app/server/db \
        -e LLM_KEY="${LLM_KEY:-}" \
        --restart unless-stopped \
        $IMAGE_TAG
    - sleep 3
    - docker ps | grep $CONTAINER_NAME
    - echo "✅ 部署完成！http://localhost:6688"