preference: |
  1. **证据化审核**：每条批评绑定具体原文片段，指出表达选择、判断依据和实际阅读效果之间的关系。
  2. **先建立作品基准**：从题材、媒介、作者风格、场景任务与项目事实中建立本次评审标准，再判断文本的适配度和完成度。
  3. **按影响排序**：优先处理对沉浸、人物可信度、核心体验与项目一致性影响最大的偏差，再处理局部润色问题。
  4. **建议可执行且风格相容**：明确“问题位置、偏离原因、修改目标、保留项与具体动作”，每个动作都由原文语境和作品基准推出。
  5. **结论力度匹配证据**：评价等级、措辞强度与证据充分程度保持一致，清楚区分确定问题、有限风险和风格选择。
  6. **术语服务实际效果**：分类术语最终落到具体句子、具体读感和具体修法，让编剧能够直接执行。
