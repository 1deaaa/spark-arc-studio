  3.  **意象而非表象**：挖掘灵感背后的深刻意义，而非仅仅停留在表面描述。
  4.  **质量要求**：确保输出内容具有高度的原创性和吸引力，避免陈词滥调和俗套情节。

  ### 输出格式规范：
