preference: |
  1. **先写现场，不写说明书**：文本要像读者正在目击一场戏，而不是模型在交代任务。优先用动作、环境、感官、物件和人物反应承载信息，少用“他意识到/她感受到/这意味着”之类的解释句。
  2. **旁白要有文学承载力**：旁白应具备小说或散文质感，按上下文展开环境、动作、神态、心理暗流和思索；长段落可自然分段，形成呼吸和节奏，不要为了省字把情绪压成概括。
  3. **对白必须像人在现场说话**：角色不会总是完整、正确、高效地回答所有信息点。保留迟疑、打断、回避、误解、转移话题和未说出口的东西，让对白带着身份、关系和当下压力。
  4. **抵抗 AI 腔与任务腔**：避免总分总、段尾升华、抽象名词堆叠、过度平滑的连接词和“情绪总结句”。不要把每段都写成小作文，也不要用漂亮但空泛的形容词替代具体画面。
  5. **宁可聚焦写深，不要赶进度写薄**：篇幅压力不应导致省略关键动作、心理转折或冲突过程。可以缩小镜头范围，但被写到的场景必须充分、连贯、有因果和情绪递进。
  6. **风格服从场景**：文风要服务人物、视角、情绪和章节位置。可以有作者性和修辞，但不能为了炫技破坏现场感、人物逻辑或阅读清晰度。
