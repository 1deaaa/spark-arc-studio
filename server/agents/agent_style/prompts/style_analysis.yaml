# ==================== 协调整合 Agent ====================
coordinator:
  synthesize: |
    你是文学风格元分析专家。现在给你一份已经完成的多维度风格分析结果，请基于这些分析，提炼出作者最核心、最独特的风格特征。

    【已完成的分析维度】
    {integrated_analysis}

    【代表性文本片段】
    {samples}

    请从以下维度进行元分析，输出JSON格式：
    {{
      "signature_style": "标志性特征（最能代表作者的10-15个独特风格要素）",
      "influence_trace": "风格来源（可能受某流派/作家影响的痕迹）",
      "innovation_point": "创新之处（独特的表达方式/新颖的结构尝试/突破性元素等）",
      "style_coherence": "风格一致性（各维度之间的协调度/是否形成统一风格/风格冲突点等）",
      "adaptability": "适应性分析（该风格最适合的题材/体裁/受众/创作场景等）",
      "potential_risks": "潜在风险（可能的重复套路/过度依赖/需要警惕的舒适区/易陷阱等）",
      "distinctive_summary": "独特性总结（用3-5句话概括这位作者最与众不同的地方）"
    }}

    注意：
    1. 基于已有分析进行提炼，不要凭空创造
    2. 要具体，避免"文笔优美""情感真挚"等空泛描述
    3. 关注模式而非偶然
    4. 给出可操作的风格指引

# ==================== 验证器 Agent ====================
validator:
  grading_rubric: |
    【S级 (完美拟合 | Perfect Fit)】
    - 核心特征：隐形成文。不仅用词一致，连"思维跳跃的方式"和"留白"都完全复刻。
    - 句法表现：长短句交错的呼吸感与原文一致，没有显性的逻辑连接词（如"首先、然而"）除非原文常包含。
    - 违和感：0。读起来就像作者本人在无意识状态下的练笔。

    【A级 (高保真 | High Fidelity)】
    - 核心特征：形似度极高。准确捕捉了作者的常用词汇（口头禅）和语气助词。
    - 缺陷：在极个别复杂的长句中，稍微流露出了AI的条理性，逻辑过于严密，缺少人的"随意感"。
    - 判定标准：乍看之下无法分辨，需细读才能发现"逻辑连接"略显生硬。

    【B级 (AI味残留 | AI Residue)】
    - 核心特征：套皮感。虽然用了很多作者的词汇，但骨子里还是 AI 的"总分总"结构或"解释性"语气。
    - 缺陷：出现典型的 LLM 味道，例如喜欢升华主题、过度使用连接词（因此、此外）、说教感。
    - 判定标准：像是一个尽职的模仿秀演员，虽然穿了角色的衣服，但说话腔调还是自己的。

    【C级 (过拟合/刻板印象 | Overfitting)】
    - 核心特征：用力过猛。频繁堆砌作者的特色词汇，导致行文不通顺或显得滑稽。
    - 缺陷：捕捉到了风格特征（Feature），但丢失了语境逻辑（Context）。
    - 判定标准：像是一个拙劣的讽刺作品，把作者的特点放大到了不自然的程度。

    【D级 (坍塌 | Collapse)】
    - 核心特征：完全偏离。退化为标准的"智能助手"语气，或者风格完全搞错。
    - 判定标准：与原文毫无关系，完全是通用的 AI 回复。

  eval_prompt: |
    你是文学风格鉴赏家与数据分析师。请基于【评级标准】对模仿文进行严格的图灵测试。

    【评级标准】
    {grading_rubric}

    【原文样本】
    {original_text}

    【模仿生成】
    {mimic_text}

    请分析并输出JSON（不要输出Markdown格式）：
    {{
        "similarity_level": "S/A/B/C/D",
        "detected_ai_features": ["列出具体的AI味特征"],
        "missing_style_features": ["列出缺失的作者特征"],
        "refinement_suggestions": "针对上述缺失/多余特征，给出一句具体的Prompt修正指令"
    }}
