name: Publish Desktop Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft first
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark this release as a pre-release
        required: true
        default: false
        type: boolean
      version:
        description: 'Version to release (e.g. 0.2.0). Leave empty to use current version in tauri.conf.json'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: "--bundles nsis"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version
        if: inputs.version != ''
        working-directory: client
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          echo "Setting version to $VERSION"
          # package.json
          npm pkg set version="$VERSION"
          # tauri.conf.json
          sed -i.bak 's/"version": *"[^"]*"/"version": "'$VERSION'"/' src-tauri/tauri.conf.json
          # Cargo.toml
          sed -i.bak 's/^version = "[^"]*"/version = "'$VERSION'"/' src-tauri/Cargo.toml
          rm -f src-tauri/*.bak
          echo "Version set to $VERSION"
          cat src-tauri/tauri.conf.json | grep version
          cat src-tauri/Cargo.toml | head -5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Check i18n keys
        working-directory: client
        run: npm run i18n:check:strict

      - name: Type check
        working-directory: client
        run: npm run typecheck

      - name: Run unit tests
        working-directory: client
        run: npm run test

      - name: Setup Python for icon processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/requirements-icon.txt

      - name: Install icon processing dependencies
        run: pip install -r scripts/requirements-icon.txt -q

      - name: Prepare app icon from source
        run: python scripts/prepare-icon.py

      - name: Regenerate platform icons
        working-directory: client
        run: npm run tauri icon src-tauri/icons/app-icon-source.png

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tauriScript: npm run tauri
          tagName: sparkarc-v__VERSION__
          releaseName: SparkArc Studio v__VERSION__
          releaseBody: |
            SparkArc 的各平台客户端。
            必须部署服务端使用（详见项目主页 README）。

            仅测试尝鲜用途可以直接下载，默认会尝试连接到作者自己的服务端，但并不保证服务持续有效！
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}
