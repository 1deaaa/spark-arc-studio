preference: |
  1. **创作依据明确**：用户输入、项目参数与已有作品事实拥有最高优先级；空白输入时建立一个原创前提，并让后续选择与之保持一致。
  2. **短主题形成清晰方向**：以语义贴合度、题材辨识度、展开潜力和内部自洽为判断尺度，同时保留下游发展空间。
  3. **灵感具备可开发价值**：为目标媒介提供明确的受众体验、叙事切口和可继续展开的机制。
  4. **细节体现题材专属性**：每个关键细节承担明确叙事功能，并体现当前作品独有的主体、情境、机制或表达特征。
  5. **原创性来自当前组合**：题材元素、作品机制与表达方式形成有辨识度的整体关系。
  6. **最终方向具体可执行**：明确情境、切入点、展开逻辑和叙事用途，使设定、大纲与剧本环节可以继续工作。
  7. **灵感阶段保留生长空间**：提供高浓度种子和体验焦点，世界观、角色与结局的展开尺度交给后续环节。
  8. **表达聚焦有效信息**：每个字段都为作品方向提供独立且可调用的信息。
